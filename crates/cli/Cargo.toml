[package]
name = "sci-form-cli"
version = "1.0.0"
edition = "2021"
# MSRV — same floor as the core crate (see the root Cargo.toml).
rust-version = "1.89"
description = "CLI tool for high-performance 3D molecular conformer generation"
license = "MIT"
repository = "https://github.com/jigonzalez930209/sci-form"
homepage = "https://sci-form.dev"
readme = "../../README.md"
keywords = ["chemistry", "conformer", "cli", "molecule", "etkdg"]
categories = ["command-line-utilities", "science"]
# Allow-list: only the CLI sources and the metadata files are published.
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
]

[[bin]]
name = "sci-form"
path = "src/main.rs"
# The binary is named after the crate, so `cargo doc --workspace` would write
# its documentation over the root library's. The library carries the
# documentation.
doc = false

[features]
default = ["parallel"]
parallel = ["sci-form/parallel"]
experimental-cga = ["sci-form/experimental-cga"]
experimental-randnla = ["sci-form/experimental-randnla"]
experimental-riemannian = ["sci-form/experimental-riemannian"]
experimental-kpm = ["sci-form/experimental-kpm"]
experimental-eeq = ["sci-form/experimental-eeq"]
experimental-alpb = ["sci-form/experimental-alpb"]
experimental-d4 = ["sci-form/experimental-d4"]
experimental-sdr = ["sci-form/experimental-sdr"]
experimental-mbh = ["sci-form/experimental-mbh"]
experimental-cpm = ["sci-form/experimental-cpm"]
experimental-gsm = ["sci-form/experimental-gsm"]
alpha-gsm = ["sci-form/alpha-gsm"]
alpha-edl = ["sci-form/alpha-edl"]
alpha-periodic-linear = ["sci-form/alpha-periodic-linear", "dep:nalgebra"]
alpha-kinetics = ["sci-form/alpha-kinetics"]
alpha-render-bridge = ["sci-form/alpha-render-bridge"]

[dependencies]
sci-form = { path = "../..", version = "1.0.0", default-features = false }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
rayon = "1.10"
serde_json = "1.0"
# `nalgebra` is only used by the `alpha-periodic-linear` commands, so it is
# optional: `cargo install sci-form-cli` no longer compiles nalgebra + simba +
# rand_distr for a code path it never takes.
nalgebra = { version = "0.35", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ── Installable packages (built by scripts/package-cli.sh) ──────────────────
# `.deb`  → cargo-deb          `.rpm` → cargo-generate-rpm
# The shell completions are generated from the binary by the script just
# before packaging (target/completions/).
[package.metadata.deb]
name = "sci-form"
maintainer = "Jose Ivan Gonzalez <jigonzalez930209@gmail.com>"
copyright = "Jose Ivan Gonzalez"
section = "science"
priority = "optional"
extended-description = "Computational chemistry from the command line: 3D structures from SMILES, semi-empirical and tight-binding quantum methods, force fields, spectra and materials. Run `sci-form` for a guide, `sci-form commands` for the list of commands."
assets = [
    ["target/release/sci-form", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/sci-form/README.md", "644"],
    ["../../LICENSE", "usr/share/doc/sci-form/copyright", "644"],
    ["../../target/completions/sci-form.bash", "usr/share/bash-completion/completions/sci-form", "644"],
    ["../../target/completions/_sci-form", "usr/share/zsh/vendor-completions/_sci-form", "644"],
    ["../../target/completions/sci-form.fish", "usr/share/fish/vendor_completions.d/sci-form.fish", "644"],
]

[package.metadata.generate-rpm]
name = "sci-form"
license = "MIT"
summary = "Computational chemistry from the command line"
assets = [
    { source = "../../target/release/sci-form", dest = "/usr/bin/sci-form", mode = "755" },
    { source = "../../README.md", dest = "/usr/share/doc/sci-form/README.md", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/sci-form/LICENSE", mode = "644", doc = true },
    { source = "../../target/completions/sci-form.bash", dest = "/usr/share/bash-completion/completions/sci-form", mode = "644" },
    { source = "../../target/completions/_sci-form", dest = "/usr/share/zsh/site-functions/_sci-form", mode = "644" },
    { source = "../../target/completions/sci-form.fish", dest = "/usr/share/fish/vendor_completions.d/sci-form.fish", mode = "644" },
]

[workspace]
members = [".", "crates/cli", "crates/python", "crates/wasm"]

[package]
name = "sci-form"
version = "0.15.2"
edition = "2021"
# MSRV. Two floors meet here:
#   * the dependency graph: indexmap 2.13 requires 1.82;
#   * the crate's own code: `u64::is_multiple_of` (used for the electron
#     parity checks) was stabilised in 1.87.
# The higher one wins. Verified with `cargo +1.87 check --workspace
# --all-targets`.
rust-version = "1.87"
authors = ["Sci-Form Team"]
description = "High-performance 3D molecular conformer generation using ETKDG distance geometry"
license = "MIT"
repository = "https://github.com/jigonzalez930209/sci-form"
homepage = "https://sci-form.dev"
documentation = "https://docs.rs/sci-form"
readme = "README.md"
keywords = ["chemistry", "conformer", "3d", "molecule", "etkdg"]
categories = ["science", "algorithms"]
# Allow-list: the published crate carries the library sources and nothing
# else. Tests, fixtures (13 MB of JSON), scripts, CI workflows, docs and the
# npm lockfiles are repo-internal and must never reach crates.io.
#
# The patterns are anchored with a leading "/" on purpose: without it they
# behave like .gitignore patterns and would match every README.md / LICENSE
# of the tree (node_modules alone ships hundreds of them).
#
# `!src/bin/**` keeps the 27 developer/debug binaries out of the tarball.
# Without it `cargo install sci-form` dropped 27 executables (several named
# `test_*`, a `$PATH` footgun) into every user's PATH, and 11 of them panic
# at startup because they read repo-relative paths that the published crate
# does not contain. The sources stay in the working tree, so `cargo build`
# still compiles them in-repo; only the published artefact is affected.
include = [
    "src/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "!src/bin/**",
]

[lib]
crate-type = ["rlib"]

# The `debug` test target is a developer scratch harness (tests/debug.rs pulls
# in every file under tests/debug/). It does not compile today:
# tests/debug/debug_ff.rs mixes f32 and f64 in the force-field gradient
# check, so `cargo test --workspace --all-targets` fails before it can run.
# The target is therefore gated behind this never-enabled feature so the
# exhaustive CI gate stays green.  Delete the `[[test]]` section above (and
# the `internal-debug-scratch` feature) once the scratch harness compiles.
[[test]]
name = "debug"
path = "tests/debug.rs"
required-features = ["internal-debug-scratch"]

[features]
default = ["parallel"]
parallel = ["rayon"]
experimental-gpu-rendering = ["dep:bytemuck"]
experimental-gpu = ["experimental-gpu-rendering", "dep:wgpu", "dep:pollster"]
# Legacy experimental flags (kept for backwards compatibility)
experimental-cga = ["alpha-cga"]
experimental-randnla = ["beta-randnla"]
experimental-riemannian = ["beta-riemannian"]
experimental-kpm = ["beta-kpm"]
experimental-eeq = []
experimental-alpb = []
experimental-d4 = []
experimental-sdr = ["alpha-sdr"]
experimental-mbh = ["beta-mbh"]
experimental-cpm = ["beta-cpm"]
experimental-gsm = ["alpha-gsm"]
# Alpha — early research, proof-of-concept
# (legacy no-ops, kept so existing feature flags and cfg gates resolve:
# alpha-reaxff core since F78; alpha-obara-saika/F80, alpha-sdr/F83,
# alpha-cga/F81, alpha-edl/F86, alpha-render-bridge/F90 core since 2026-10-14)
alpha-cga = []
alpha-gsm = []
alpha-sdr = []
alpha-dynamics-live = []
alpha-dft = []
alpha-reaxff = []
alpha-obara-saika = []
alpha-mlff = []
alpha-imd = []
alpha-edl = ["experimental-cpm", "experimental-eeq", "experimental-alpb"]
alpha-periodic-linear = ["experimental-kpm", "experimental-randnla"]
alpha-kinetics = ["experimental-gsm", "experimental-mbh"]
alpha-render-bridge = ["experimental-kpm", "experimental-gsm", "experimental-gpu-rendering"]
alpha-reaction-dynamics = []
# Beta — tested, approaching core readiness
# (beta-cpm/F95 and beta-riemannian/F94 core since 2026-10; kept as aliases)
beta-kpm = []
beta-mbh = []
beta-cpm = []
beta-randnla = []
beta-riemannian = []
# Never enabled by anything: it gates the broken `debug` scratch test target
# (see the `[[test]]` section above).
internal-debug-scratch = []

[dependencies]
flate2 = "1.1"
petgraph = "0.6.4"
# The "rand" feature of nalgebra is not used by this crate: dropping it keeps
# `rand_distr` out of the dependency graph of every downstream build.
# (`simba` and the unmaintained `paste` it pulls in are *mandatory*
# dependencies of nalgebra 0.32, so they cannot be removed — see deny.toml.)
nalgebra = { version = "0.32", default-features = false, features = ["std", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8.8"
rayon = { version = "1.10", optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }
pollster = { version = "0.3", optional = true }
wgpu = { version = "0.19", optional = true }

[dev-dependencies]
rayon = "1.10"
approx = "0.5"

[profile.release]
opt-level = 3
lto = true
strip = true

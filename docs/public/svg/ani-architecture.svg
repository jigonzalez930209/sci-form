<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="850" height="250" role="img" aria-label="ANI inference: geometry, neighbor list, atomic environment vectors, per-element network and analytic forces.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-ani-architecture-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-ani-architecture-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-ani-architecture-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="850" height="250" fill="url(#sf-ani-architecture-glow)" stroke="none"/>
<rect x="30" y="70" width="140" height="120" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><rect x="31.5" y="71.5" width="137" height="4" rx="2" fill="var(--sf-accent)" stroke="none" stroke-width="1.4"/><text x="100" y="112" text-anchor="middle" font-size="11.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)" class="sf-rise sf-d1">geometry</text><text x="100" y="130" text-anchor="middle" font-size="8.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)" class="sf-rise sf-d1">atoms + cell</text><circle cx="100" cy="158" r="14" fill="var(--sf-soft)" stroke="var(--sf-accent)" stroke-width="1.5" class="sf-pulse"/><path d="M174,130 L192,130" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-ani-architecture-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.2s" repeatCount="indefinite" path="M174,130 L192,130"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle><rect x="192" y="70" width="140" height="120" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><rect x="193.5" y="71.5" width="137" height="4" rx="2" fill="var(--sf-accent2)" stroke="none" stroke-width="1.4"/><text x="262" y="112" text-anchor="middle" font-size="11.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)" class="sf-rise sf-d2">neighbors</text><text x="262" y="130" text-anchor="middle" font-size="8.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)" class="sf-rise sf-d2">cell list</text><circle cx="262" cy="158" r="14" fill="var(--sf-soft)" stroke="var(--sf-accent2)" stroke-width="1.5" class="sf-pulse"/><path d="M336,130 L354,130" fill="none" stroke="var(--sf-accent2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-ani-architecture-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent2)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.35s" repeatCount="indefinite" path="M336,130 L354,130"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.35s" repeatCount="indefinite"/></circle><rect x="354" y="70" width="140" height="120" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><rect x="355.5" y="71.5" width="137" height="4" rx="2" fill="var(--sf-violet)" stroke="none" stroke-width="1.4"/><text x="424" y="112" text-anchor="middle" font-size="11.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)" class="sf-rise sf-d3">AEV</text><text x="424" y="130" text-anchor="middle" font-size="8.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)" class="sf-rise sf-d3">radial + angular</text><circle cx="424" cy="158" r="14" fill="var(--sf-soft)" stroke="var(--sf-violet)" stroke-width="1.5" class="sf-pulse"/><path d="M498,130 L516,130" fill="none" stroke="var(--sf-violet)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-ani-architecture-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-violet)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.5s" repeatCount="indefinite" path="M498,130 L516,130"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.5s" repeatCount="indefinite"/></circle><rect x="516" y="70" width="140" height="120" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><rect x="517.5" y="71.5" width="137" height="4" rx="2" fill="var(--sf-warm)" stroke="none" stroke-width="1.4"/><text x="586" y="112" text-anchor="middle" font-size="11.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)" class="sf-rise sf-d4">network</text><text x="586" y="130" text-anchor="middle" font-size="8.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)" class="sf-rise sf-d4">per element</text><circle cx="586" cy="158" r="14" fill="var(--sf-soft)" stroke="var(--sf-warm)" stroke-width="1.5" class="sf-pulse"/><path d="M660,130 L678,130" fill="none" stroke="var(--sf-warm)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-ani-architecture-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-warm)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.6499999999999999s" repeatCount="indefinite" path="M660,130 L678,130"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.6499999999999999s" repeatCount="indefinite"/></circle><rect x="678" y="70" width="140" height="120" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><rect x="679.5" y="71.5" width="137" height="4" rx="2" fill="var(--sf-rose)" stroke="none" stroke-width="1.4"/><text x="748" y="112" text-anchor="middle" font-size="11.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)" class="sf-rise sf-d5">forces</text><text x="748" y="130" text-anchor="middle" font-size="8.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)" class="sf-rise sf-d5">analytic</text><circle cx="748" cy="158" r="14" fill="var(--sf-soft)" stroke="var(--sf-rose)" stroke-width="1.5" class="sf-pulse"/><circle cx="568" cy="157.0" r="3" fill="var(--sf-warm)" opacity="0.8"/><circle cx="568" cy="170.0" r="3" fill="var(--sf-warm)" opacity="0.8"/><circle cx="568" cy="183.0" r="3" fill="var(--sf-warm)" opacity="0.8"/><circle cx="592" cy="150.5" r="3" fill="var(--sf-warm)" opacity="0.8"/><circle cx="592" cy="163.5" r="3" fill="var(--sf-warm)" opacity="0.8"/><circle cx="592" cy="176.5" r="3" fill="var(--sf-warm)" opacity="0.8"/><circle cx="592" cy="189.5" r="3" fill="var(--sf-warm)" opacity="0.8"/><circle cx="616" cy="163.5" r="3" fill="var(--sf-warm)" opacity="0.8"/><circle cx="616" cy="176.5" r="3" fill="var(--sf-warm)" opacity="0.8"/><rect x="330" y="220" width="170" height="22" rx="11.0" fill="var(--sf-soft)" stroke="var(--sf-accent2)" stroke-width="1"/><text x="415.0" y="234.5" text-anchor="middle" font-size="10" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">translation + rotation invariant</text>
</svg>

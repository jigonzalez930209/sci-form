<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" width="780" height="280" role="img" aria-label="A conformal motor rotates a molecular subtree around a bond axis.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-experimental-cga-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-experimental-cga-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-experimental-cga-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="780" height="280" fill="url(#sf-experimental-cga-glow)" stroke="none"/>
<circle cx="150" cy="160" r="9" fill="var(--sf-accent)" class="sf-pulse"/><text x="150" y="208" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">point</text><path d="M150,160 L184,140" fill="none" stroke="var(--sf-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sf-flow"/><text x="192.5" y="135.0" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">e₁</text><path d="M150,160 L124,130" fill="none" stroke="var(--sf-accent2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sf-flow"/><text x="117.5" y="122.5" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">e₂</text><path d="M150,160 L158,194" fill="none" stroke="var(--sf-violet)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sf-flow"/><text x="160.0" y="202.5" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">e₃</text><path d="M150,108 A52,52 0 1 1 149.9,108" fill="none" stroke="var(--sf-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6" class="sf-spin"/><path d="M215,160 L330,160" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-experimental-cga-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.2s" repeatCount="indefinite" path="M215,160 L330,160"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle><text x="272" y="145" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">motor</text><g class="sf-spin"><path d="M501.74,113.86 L527.17,142.10 L515.43,178.24 L478.26,186.14 L452.83,157.90 L464.57,121.76 Z" fill="none" stroke="var(--sf-line)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="490" cy="150" r="21.28" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" opacity="0.75"/><circle cx="501.742645786248" cy="113.85985238078416" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="527.1696088278846" cy="142.09935574892515" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="515.4269630416366" cy="178.239503368141" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="478.257354213752" cy="186.14014761921584" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="452.83039117211536" cy="157.90064425107485" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="464.5730369583634" cy="121.76049663185901" r="4.5" fill="var(--sf-ink)" opacity="0.85"/></g><path d="M420,110 A90,90 0 0 1 560,110" fill="none" stroke="var(--sf-accent2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sf-flow"/><path d="M560,110 l-10,-2 l6,9" fill="none" stroke="var(--sf-accent2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="490" y="222" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">rotated subtree</text><rect x="410" y="40" width="100" height="22" rx="11.0" fill="var(--sf-soft)" stroke="var(--sf-accent2)" stroke-width="1"/><text x="460.0" y="54.5" text-anchor="middle" font-size="10" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">G(4,1) motor</text>
</svg>

round" class="sf-flow"/><text x="837" y="130" text-anchor="start" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">60°</text><text x="811" y="216" text-anchor="middle" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">view along the axis</text><text x="735" y="234" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">X′ = M X M̃  (sandwich)</text><text x="735" y="252" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">R = cos(θ/2) − sin(θ/2) L̂</text><text x="735" y="268" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">T = 1 − ½ t e∞</text><text x="735" y="292" text-anchor="middle" font-size="9.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">vs Rodrigues + clifford Cl(4,1):</text><text x="735" y="310" text-anchor="middle" font-size="9.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">motors 3.4e-15, dihedral 6.6e-15</text><text x="735" y="326" text-anchor="middle" font-size="9" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">16 rigid motions</text>

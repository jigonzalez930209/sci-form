dth="1.4" opacity="0.75"/><rect x="186" y="220" width="11" height="16" rx="2" fill="var(--sf-line)" stroke="none" stroke-width="1.4" opacity="0.75"/><text x="278" y="231" text-anchor="end" font-size="9" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">trivectors · 10</text><text x="44" y="271" text-anchor="middle" font-size="11" font-weight="800" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">4</text><rect x="60" y="260" width="11" height="16" rx="2" fill="var(--sf-violet)" stroke="none" stroke-width="1.4" opacity="0.75"/><rect x="74" y="260" width="11" height="16" rx="2" fill="var(--sf-violet)" stroke="none" stroke-width="1.4" opacity="0.75"/><rect x="88" y="260" width="11" height="16" rx="2" fill="var(--sf-violet)" stroke="none" stroke-width="1.4" opacity="0.75"/><rect x="102" y="260" width="11" height="16" rx="2" fill="var(--sf-violet)" stroke="none" stroke-width="1.4" opacity="0.75"/><rect x="116" y="260" width="11" height="16" rx="2" fill="var(--sf-violet)" stroke="none" stroke-width="1.4" opacity="0.75"/><text x="278" y="271" text-anchor="end" font-size="9" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">4-vectors · 5</text><text x="44" y="311" text-anchor="middle" font-size="11" font-weight="800" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">5</text><rect x="60" y="300" width="11" height="16" rx="2" fill="var(--sf-line)" stroke="none" stroke-width="1.4" opacity="0.75"/><text x="278" y="311" text-anchor="end" font-size="9" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">pseudoscalar · 1</text><text x="159" y="352" text-anchor="middle" font-size="9.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Robot
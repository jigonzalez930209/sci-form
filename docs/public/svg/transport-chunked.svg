<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" role="img" aria-label="A large result is streamed in chunks to independent workers.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-transport-chunked-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-transport-chunked-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-transport-chunked-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="700" height="280" fill="url(#sf-transport-chunked-glow)" stroke="none"/>
<rect x="45" y="85" width="210" height="80" rx="12" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><rect x="55" y="100" width="15" height="50" rx="3" fill="var(--sf-accent)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d1" opacity="0.55"/><rect x="74" y="100" width="15" height="50" rx="3" fill="var(--sf-accent)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d2" opacity="0.55"/><rect x="93" y="100" width="15" height="50" rx="3" fill="var(--sf-accent)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d3" opacity="0.55"/><rect x="112" y="100" width="15" height="50" rx="3" fill="var(--sf-accent)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d4" opacity="0.55"/><rect x="131" y="100" width="15" height="50" rx="3" fill="var(--sf-accent)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d5" opacity="0.55"/><rect x="150" y="100" width="15" height="50" rx="3" fill="var(--sf-accent)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d6" opacity="0.55"/><rect x="169" y="100" width="15" height="50" rx="3" fill="var(--sf-accent)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d1" opacity="0.55"/><rect x="188" y="100" width="15" height="50" rx="3" fill="var(--sf-accent)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d2" opacity="0.55"/><rect x="207" y="100" width="15" height="50" rx="3" fill="var(--sf-accent)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d3" opacity="0.55"/><rect x="226" y="100" width="15" height="50" rx="3" fill="var(--sf-accent)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d4" opacity="0.55"/><text x="150" y="190" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">large result</text><path d="M265,125 Q291.0979600271143,94.35042443323003 330,84" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-transport-chunked-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.2s" repeatCount="indefinite" path="M265,125 Q291.0979600271143,94.35042443323003 330,84"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle><rect x="345" y="60" width="100" height="48" rx="8" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="395" y="88" text-anchor="middle" font-size="9.5" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">chunk 0</text><path d="M265,125 L330,150" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-transport-chunked-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.4s" repeatCount="indefinite" path="M265,125 L330,150"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.4s" repeatCount="indefinite"/></circle><rect x="345" y="126" width="100" height="48" rx="8" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="395" y="154" text-anchor="middle" font-size="9.5" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">chunk 1</text><path d="M265,125 Q287.73519834551917,177.47485832462917 330,216" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-transport-chunked-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.6000000000000001s" repeatCount="indefinite" path="M265,125 Q287.73519834551917,177.47485832462917 330,216"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.6000000000000001s" repeatCount="indefinite"/></circle><rect x="345" y="192" width="100" height="48" rx="8" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="395" y="220" text-anchor="middle" font-size="9.5" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">chunk 2</text><rect x="520" y="55" width="120" height="52" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><circle cx="550" cy="81" r="9" fill="var(--sf-accent2)" class="sf-pulse"/><text x="590" y="86" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">worker 0</text><path d="M450,84 L515,81" fill="none" stroke="var(--sf-accent2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-transport-chunked-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent2)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.4s" repeatCount="indefinite" path="M450,84 L515,81"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.4s" repeatCount="indefinite"/></circle><rect x="520" y="121" width="120" height="52" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><circle cx="550" cy="147" r="9" fill="var(--sf-accent2)" class="sf-pulse"/><text x="590" y="152" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">worker 1</text><path d="M450,150 L515,147" fill="none" stroke="var(--sf-accent2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-transport-chunked-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent2)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.6000000000000001s" repeatCount="indefinite" path="M450,150 L515,147"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.6000000000000001s" repeatCount="indefinite"/></circle><rect x="520" y="187" width="120" height="52" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><circle cx="550" cy="213" r="9" fill="var(--sf-accent2)" class="sf-pulse"/><text x="590" y="218" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">worker 2</text><path d="M450,216 L515,213" fill="none" stroke="var(--sf-accent2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-transport-chunked-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent2)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.8s" repeatCount="indefinite" path="M450,216 L515,213"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle><rect x="270" y="250" width="150" height="22" rx="11.0" fill="var(--sf-soft)" stroke="var(--sf-accent2)" stroke-width="1"/><text x="345.0" y="264.5" text-anchor="middle" font-size="10" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">streamed chunks</text>
</svg>

<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" width="900" height="386" role="img" aria-label="SMARTS torsion matching on butane: three real CSD patterns fail for stated reasons and [!#1][CX4]!@;-[CX4][!#1] matches first, giving V3 = 7.0.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-smarts-pattern-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-smarts-pattern-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-smarts-pattern-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="900" height="386" fill="url(#sf-smarts-pattern-glow)" stroke="none"/>
<defs><radialGradient id="sf-smarts-pattern-C" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#1e293b"/></radialGradient><radialGradient id="sf-smarts-pattern-O" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fda4af"/><stop offset="100%" stop-color="#be123c"/></radialGradient><radialGradient id="sf-smarts-pattern-N" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#1d4ed8"/></radialGradient><radialGradient id="sf-smarts-pattern-H" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cbd5e1"/></radialGradient><radialGradient id="sf-smarts-pattern-S" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#b45309"/></radialGradient><marker id="sf-smarts-pattern-arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-rose)"/></marker></defs><text x="450" y="30" text-anchor="middle" font-size="15" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">Torsion matching on butane's central bond — first match wins</text><rect x="24" y="50" width="300" height="320" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><text x="174" y="74" text-anchor="middle" font-size="11.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">target: butane, bond C2–C3</text><path d="M70,230 L130,160 L210,220 L270,150" fill="none" stroke="var(--sf-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M130,160 L210,220" fill="none" stroke="var(--sf-warm)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" class="sf-pulse" opacity="0.35"/><circle cx="70" cy="230" r="13" fill="url(#sf-smarts-pattern-C)"/><text x="70" y="234.68" text-anchor="middle" font-size="12" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">C</text><rect x="57" y="248" width="26" height="20" rx="6" fill="var(--sf-violet)" stroke="none" stroke-width="1.4"/><text x="70" y="262" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">:1</text><circle cx="130" cy="160" r="13" fill="url(#sf-smarts-pattern-C)"/><text x="130" y="164.68" text-anchor="middle" font-size="12" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">C</text><rect x="117" y="120" width="26" height="20" rx="6" fill="var(--sf-violet)" stroke="none" stroke-width="1.4"/><text x="130" y="134" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">:2</text><circle cx="210" cy="220" r="13" fill="url(#sf-smarts-pattern-C)"/><text x="210" y="224.68" text-anchor="middle" font-size="12" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">C</text><rect x="197" y="238" width="26" height="20" rx="6" fill="var(--sf-violet)" stroke="none" stroke-width="1.4"/><text x="210" y="252" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">:3</text><circle cx="270" cy="150" r="13" fill="url(#sf-smarts-pattern-C)"/><text x="270" y="154.68" text-anchor="middle" font-size="12" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">C</text><rect x="257" y="110" width="26" height="20" rx="6" fill="var(--sf-violet)" stroke="none" stroke-width="1.4"/><text x="270" y="124" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">:4</text><text x="174" y="300" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">rotatable: single, not in ring (!@)</text><text x="174" y="318" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">both centers CX4 (4 connections)</text><text x="174" y="346" text-anchor="middle" font-size="10" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">→ coefficients for this torsion</text><rect x="344" y="50" width="532" height="320" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><text x="360" y="74" text-anchor="start" font-size="11.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">CSD table, scanned in priority order</text><rect x="358" y="92" width="504" height="46" rx="9" fill="var(--sf-card2)" stroke="var(--sf-rose)" stroke-width="0.8"/><circle cx="378" cy="115" r="9" fill="var(--sf-rose)"/><path d="M374,111 l8,8 M382,111 l-8,8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="396" y="112" text-anchor="start" font-size="10.5" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">[O:1]=[C:2]!@;-[O:3]~[CH0:4]</text><text x="396" y="129" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">no C=O in butane</text><rect x="358" y="148" width="504" height="46" rx="9" fill="var(--sf-card2)" stroke="var(--sf-rose)" stroke-width="0.8"/><circle cx="378" cy="171" r="9" fill="var(--sf-rose)"/><path d="M374,167 l8,8 M382,167 l-8,8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="396" y="168" text-anchor="start" font-size="10.5" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">[CX3:1]=[CX3:2]!@;-[CH2:3][C:4]</text><text x="396" y="185" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">:2 must be CX3 (sp²); C2 is CX4</text><rect x="358" y="204" width="504" height="46" rx="9" fill="var(--sf-card2)" stroke="var(--sf-rose)" stroke-width="0.8"/><circle cx="378" cy="227" r="9" fill="var(--sf-rose)"/><path d="M374,223 l8,8 M382,223 l-8,8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="396" y="224" text-anchor="start" font-size="10.5" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">[cH0:1][c:2]!@;-[CX4H2:3][CX4:4]</text><text x="396" y="241" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">:1, :2 must be aromatic</text><rect x="358" y="260" width="504" height="46" rx="9" fill="var(--sf-soft)" stroke="var(--sf-accent2)" stroke-width="1.4" class="sf-pulse"/><circle cx="378" cy="283" r="9" fill="var(--sf-accent2)"/><path d="M374,283 l3,3 l6,-6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="396" y="280" text-anchor="start" font-size="10.5" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">[!#1:1][CX4:2]!@;-[CX4:3][!#1:4]</text><text x="396" y="297" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">all four atoms map ✓</text><text x="610" y="330" text-anchor="middle" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">V₃ = 7.0, s₃ = +1  →  V(φ) = 7 (1 + cos 3φ)</text><text x="610" y="352" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">no match in all 837 → basic-knowledge rule (SP3–SP3: V₃ = 7.0)</text>
</svg>

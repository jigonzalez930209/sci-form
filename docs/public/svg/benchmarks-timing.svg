<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-label="Measured embed time for n-alkanes from 17 to 302 atoms on a log-log plot, rising from 1.4 milliseconds to 1.77 seconds with a fitted exponent of 2.24, between the N squared and N cubed guides.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-benchmarks-timing-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-benchmarks-timing-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-benchmarks-timing-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="900" height="390" fill="url(#sf-benchmarks-timing-glow)" stroke="none"/>
<defs><radialGradient id="sf-benchmarks-timing-C" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#1e293b"/></radialGradient><radialGradient id="sf-benchmarks-timing-O" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fda4af"/><stop offset="100%" stop-color="#be123c"/></radialGradient><radialGradient id="sf-benchmarks-timing-N" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#1d4ed8"/></radialGradient><radialGradient id="sf-benchmarks-timing-H" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cbd5e1"/></radialGradient><radialGradient id="sf-benchmarks-timing-S" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#b45309"/></radialGradient><marker id="sf-benchmarks-timing-arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-rose)"/></marker></defs><text x="450" y="30" text-anchor="middle" font-size="15" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">Embed time vs. size — n-alkanes CₙH₂ₙ₊₂, measured (median of 5 seeds)</text><rect x="24" y="50" width="580" height="324" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><path d="M90,70 L90,320 M90,320 L570,320" fill="none" stroke="var(--sf-line)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M90,320 l4,-4 M90,320 l-4,-4" fill="none" stroke="var(--sf-line)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M90,70 l-4,4 M90,70 l4,4" fill="none" stroke="var(--sf-line)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><text x="330.0" y="342" text-anchor="middle" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">atoms (log)</text><text x="96" y="64" text-anchor="start" font-size="9" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">ms per conformer (log)</text><text x="90.0" y="333" text-anchor="middle" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">10</text><text x="233.1363764158987" y="333" text-anchor="middle" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">30</text><text x="390.0" y="333" text-anchor="middle" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">100</text><text x="533.1363764158988" y="333" text-anchor="middle" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">300</text><text x="82" y="303.7692307692308" text-anchor="end" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">1</text><path d="M90,300.8 L570,300.8" fill="none" stroke="var(--sf-line)" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><text x="82" y="239.66666666666666" text-anchor="end" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">10</text><path d="M90,236.7 L570,236.7" fill="none" stroke="var(--sf-line)" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><text x="82" y="175.56410256410257" text-anchor="end" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">100</text><path d="M90,172.6 L570,172.6" fill="none" stroke="var(--sf-line)" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><text x="82" y="111.46153846153845" text-anchor="end" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">1000</text><path d="M90,108.5 L570,108.5" fill="none" stroke="var(--sf-line)" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><path d="M327.7,189.8 L534.0,101.7" fill="none" stroke="var(--sf-line)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="538.0020828871452" y="104.68137542340304" text-anchor="start" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-line)">N²</text><path d="M327.7,189.8 L509.1,73.6" fill="none" stroke="var(--sf-rose)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="513.0703076367918" y="76.58538177241823" text-anchor="start" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">N³</text><path d="M159.13,292.01 L241.54,246.20 L291.63,211.12 L327.72,189.84 L379.14,165.07 L415.91,146.83 L444.55,131.68 L468.02,121.00 L505.14,103.65 L534.00,92.55" fill="none" stroke="var(--sf-accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="sf-draw"/><circle cx="159.13467641348217" cy="292.00509184894827" r="3.6" fill="var(--sf-accent)"/><circle cx="241.5449934959718" cy="246.20138790262337" r="3.6" fill="var(--sf-accent)"/><circle cx="291.62935738071525" cy="211.12430451229335" r="3.6" fill="var(--sf-accent)"/><circle cx="327.7175068494762" cy="189.83717714890264" r="3.6" fill="var(--sf-accent)"/><circle cx="379.13634820366656" cy="165.07222523543285" r="3.6" fill="var(--sf-accent)"/><circle cx="415.9079492024245" cy="146.83440342746277" r="3.6" fill="var(--sf-accent)"/><circle cx="444.5530763834318" cy="131.68270333151773" r="3.6" fill="var(--sf-accent)"/><circle cx="468.02141639552235" cy="121.00097409246726" r="3.6" fill="var(--sf-accent)"/><circle cx="505.14460979412934" cy="103.65319561894847" r="3.6" fill="var(--sf-accent)"/><circle cx="534.0020828871452" cy="92.54836313045365" r="3.6" fill="var(--sf-accent)"/><text x="530.0020828871452" y="112.55009223140547" text-anchor="end" font-size="9.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">302 atoms: 1.77 s</text><text x="165.13467641348217" y="284.00509184894827" text-anchor="start" font-size="9.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">17 atoms: 1.4 ms</text><rect x="624" y="50" width="252" height="324" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><text x="638" y="74" text-anchor="start" font-size="11.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">what dominates</text><text x="638" y="98" text-anchor="start" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">fitted slope (62–302 atoms): 2.24</text><text x="638" y="126" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">Floyd–Warshall smoothing: O(N³)</text><text x="638" y="146" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">BFGS: O(N²) per iteration</text><text x="638" y="166" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">eigenpairs by power iteration</text><text x="638" y="186" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">measured exponent below 3:</text><text x="638" y="206" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">N³ term not yet dominant here</text><text x="638" y="248" text-anchor="start" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">recorded throughputs</text><text x="638" y="270" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">diverse 131 (small): 138.9 mol/s</text><text x="638" y="290" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">ChemBL 10K (≤ 100 heavy): 2.1 mol/s</text><text x="638" y="320" text-anchor="start" font-size="9" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">machine-dependent; alkane data</text><text x="638" y="336" text-anchor="start" font-size="9" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">from the Python wheel, 16 threads</text>
</svg>

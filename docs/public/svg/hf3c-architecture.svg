ight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">LUMO +0.570</text><text x="452" y="261" text-anchor="start" font-size="8.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">O 1s −20.24</text><text x="423.0" y="288" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">converged in 9 iterations</text><text x="423.0" y="306" text-anchor="middle" font-size="9.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">10 electrons · gap 0.956 Ha</text><text x="582" y="134" text-anchor="start" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">D3(BJ)</text><rect x="635.8083333333333" y="122" width="2.191666666666667" height="18" rx="3" fill="var(--sf-warm)" stroke="none" stroke-width="1.4" opacity="0.75"/><text x="808" y="154" text-anchor="end" font-size="9.5" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">-0.00263</text><text x="582" y="180" text-anchor="start" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">gCP</text><rect x="638" y="168" width="2" height="18" rx="3" fill="var(--sf-violet)" stroke="none" stroke-width="1.4" opacity="0.75"/><text x="808" y="200" text-anchor="end" font-size="9.5" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">+0.00183</text><text x="582" y="226" text-anchor="start" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">SRB</text><rect x="638" y="214" width="143.60833333333335" heigh
 iteration</text><text x="62" y="200.0" text-anchor="middle" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)" transform="rotate(-90 62 200.0)">log₁₀ residual</text><path d="M80,91.7 L600,91.7" fill="none" stroke="var(--sf-line)" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><text x="72" y="94.66666666666666" text-anchor="end" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">1</text><path d="M80,156.7 L600,156.7" fill="none" stroke="var(--sf-line)" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><text x="72" y="159.66666666666666" text-anchor="end" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">1e-3</text><path d="M80,221.7 L600,221.7" fill="none" stroke="var(--sf-line)" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><text x="72" y="224.66666666666669" text-anchor="end" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">1e-6</text><path d="M80,286.7 L600,286.7" fill="none" stroke="var(--sf-line)" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><text x="72" y="289.6666666666667" text-anchor="end" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">1e-9</text><text x="80.0" y="343" text-anchor="middle" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">0</text><text x="210.0" y="343" text-anchor="middle" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-sy
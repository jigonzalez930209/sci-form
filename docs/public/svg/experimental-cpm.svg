<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" role="img" aria-label="Constant-potential method on a toy two-plate cell: the linear system gives opposite plate charges with larger edge charges, a linear charge-voltage response whose slope is the capacitance, and the spectral-radius reason the damped fixed point was replaced by a direct LU solve.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-experimental-cpm-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-experimental-cpm-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-experimental-cpm-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="900" height="396" fill="url(#sf-experimental-cpm-glow)" stroke="none"/>
<defs><radialGradient id="sf-experimental-cpm-C" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#1e293b"/></radialGradient><radialGradient id="sf-experimental-cpm-O" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fda4af"/><stop offset="100%" stop-color="#be123c"/></radialGradient><radialGradient id="sf-experimental-cpm-N" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#1d4ed8"/></radialGradient><radialGradient id="sf-experimental-cpm-H" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cbd5e1"/></radialGradient><radialGradient id="sf-experimental-cpm-S" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#b45309"/></radialGradient><marker id="sf-experimental-cpm-arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-rose)"/></marker></defs><text x="450" y="30" text-anchor="middle" font-size="14" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">Constant-potential charges: solve M q = μ − χ (toy two-plate cell computed for this figure)</text><rect x="24" y="50" width="300" height="330" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><text x="174" y="74" text-anchor="middle" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">plates at +V/2 and −V/2 (V = 2 V)</text><circle cx="86" cy="120" r="9.036323588400032" fill="var(--sf-accent)" class="sf-pulse" opacity="0.8"/><circle cx="108" cy="130" r="6.964027143534356" fill="var(--sf-accent)" class="sf-pulse" opacity="0.8"/><circle cx="130" cy="140" r="9.03632358840003" fill="var(--sf-accent)" class="sf-pulse" opacity="0.8"/><circle cx="146" cy="120" r="6.964027143534356" fill="var(--sf-accent)" class="sf-pulse" opacity="0.8"/><circle cx="168" cy="130" r="6.123252231992163" fill="var(--sf-accent)" class="sf-pulse" opacity="0.8"/><circle cx="190" cy="140" r="6.964027143534357" fill="var(--sf-accent)" class="sf-pulse" opacity="0.8"/><circle cx="206" cy="120" r="9.03632358840003" fill="var(--sf-accent)" class="sf-pulse" opacity="0.8"/><circle cx="228" cy="130" r="6.964027143534357" fill="var(--sf-accent)" class="sf-pulse" opacity="0.8"/><circle cx="250" cy="140" r="9.03632358840003" fill="var(--sf-accent)" class="sf-pulse" opacity="0.8"/><text x="300" y="134" text-anchor="end" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">+V/2</text><circle cx="86" cy="270" r="9.03632358840003" fill="var(--sf-rose)" class="sf-pulse" opacity="0.8"/><circle cx="108" cy="280" r="6.9640271435343575" fill="var(--sf-rose)" class="sf-pulse" opacity="0.8"/><circle cx="130" cy="290" r="9.036323588400032" fill="var(--sf-rose)" class="sf-pulse" opacity="0.8"/><circle cx="146" cy="270" r="6.964027143534354" fill="var(--sf-rose)" class="sf-pulse" opacity="0.8"/><circle cx="168" cy="280" r="6.123252231992168" fill="var(--sf-rose)" class="sf-pulse" opacity="0.8"/><circle cx="190" cy="290" r="6.964027143534352" fill="var(--sf-rose)" class="sf-pulse" opacity="0.8"/><circle cx="206" cy="270" r="9.036323588400034" fill="var(--sf-rose)" class="sf-pulse" opacity="0.8"/><circle cx="228" cy="280" r="6.964027143534355" fill="var(--sf-rose)" class="sf-pulse" opacity="0.8"/><circle cx="250" cy="290" r="9.03632358840003" fill="var(--sf-rose)" class="sf-pulse" opacity="0.8"/><text x="300" y="284" text-anchor="end" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">−V/2</text><path d="M174,170 L174,250" fill="none" stroke="var(--sf-line)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="184" y="214" text-anchor="start" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">6 Å</text><text x="174" y="330" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">Q_plate = +0.403 e  /  -0.403 e</text><text x="174" y="350" text-anchor="middle" font-size="9" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">edge atoms carry more charge</text><text x="174" y="366" text-anchor="middle" font-size="9" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">η = 10, χ = 0, ε = 1 (toy values)</text><rect x="344" y="50" width="270" height="330" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><text x="358" y="72" text-anchor="start" font-size="11.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">charge response Q(V)</text><text x="358" y="90" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">C = ∂Q/∂V = 0.202 e/V</text><path d="M374,104 L374,338 L598,338" fill="none" stroke="var(--sf-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M374,221.0 L598,221.0" fill="none" stroke="var(--sf-line)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 3"/><path d="M374.0,327.4 L375.4,326.0 L376.8,324.7 L378.2,323.4 L379.6,322.0 L381.0,320.7 L382.4,319.4 L383.8,318.1 L385.2,316.7 L386.6,315.4 L388.0,314.1 L389.4,312.7 L390.8,311.4 L392.2,310.1 L393.6,308.8 L395.0,307.4 L396.4,306.1 L397.8,304.8 L399.2,303.4 L400.6,302.1 L402.0,300.8 L403.4,299.4 L404.8,298.1 L406.2,296.8 L4
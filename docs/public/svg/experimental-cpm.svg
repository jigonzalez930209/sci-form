if,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">V (volts)</text><text x="479.0" y="370" text-anchor="middle" font-size="9" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">linear: one LU solve per potential</text><rect x="634" y="50" width="242" height="330" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><text x="755" y="74" text-anchor="middle" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">why LU, not fixed point</text><text x="755" y="98" text-anchor="middle" font-size="9.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">Mᵢᵢ = ηᵢ, Mᵢⱼ = 14.3996/(ε rᵢⱼ)</text><text x="755" y="130" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">fixed point q ← (q + q_new)/2</text><text x="755" y="148" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">converges only if ρ(J/η) &lt; 1</text><text x="755" y="178" text-anchor="middle" font-size="11" font-weight="800" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">this toy: ρ(J/η) = 5.11</text><text x="755" y="200" text-anchor="middle" font-size="9.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">(diverges)</text><text x="755" y="232" text-anchor="middle" font-size="9.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">graphene bilayer: charges → 1e157</text><text x="755" y="250" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">before 2026-10-13 → LU since</text><text x="755" y="286" text-anchor="middle" font-size="9" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">vs LAMMPS electrode/conp:</text><text x="755" y="302" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">plate charge scale 1.76×,</text><text x="755" y="318" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">per-atom cosine 0.44</text><text x="755" y="348" text-anchor="middle" font-size="9" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">(experimental: not yet parity)</text>
</svg>

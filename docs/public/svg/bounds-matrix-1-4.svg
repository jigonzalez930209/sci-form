 UI",Roboto,sans-serif' fill="var(--sf-rose)">d₁₄ = 2.52 Å</text><rect x="270" y="60" width="210" height="230" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><path d="M313.8,106.5 L434.9,243.5" fill="none" stroke="var(--sf-accent2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" class="sf-flow"/><path d="M313.8,106.5 L338.0,175.0 L410.7,175.0 L434.9,243.5" fill="none" stroke="var(--sf-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="313.7774596727211" cy="106.4836652754006" r="10" fill="url(#sf-bounds-matrix-1-4-C)"/><text x="313.7774596727211" y="110.08366527540059" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">C</text><text x="313.7774596727211" y="90.4836652754006" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">C1</text><circle cx="338.0" cy="175.0" r="10" fill="url(#sf-bounds-matrix-1-4-C)"/><text x="338.0" y="178.6" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">C</text><text x="338.0" y="199.0" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">C2</text><circle cx="410.672" cy="175.0" r="10" fill="url(#sf-bounds-matrix-1-4-C)"/><text x="410.672" y="178.6" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">C</text><text x="410.672" y="199.0" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">C3</text><circle cx="434.89454032727895" cy="243.5163347245994" r="
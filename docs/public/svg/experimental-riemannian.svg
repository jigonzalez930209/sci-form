<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" width="900" height="406" role="img" aria-label="Optimization on the positive-semidefinite set shown exactly as the unit disk of trace-2, 2 by 2 matrices: raw gradient steps toward an indefinite target leave the disk, retraction brings them back and the iterates converge to the PSD projection of the target.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-experimental-riemannian-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-experimental-riemannian-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-experimental-riemannian-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="900" height="406" fill="url(#sf-experimental-riemannian-glow)" stroke="none"/>
<defs><radialGradient id="sf-experimental-riemannian-C" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#1e293b"/></radialGradient><radialGradient id="sf-experimental-riemannian-O" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fda4af"/><stop offset="100%" stop-color="#be123c"/></radialGradient><radialGradient id="sf-experimental-riemannian-N" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#1d4ed8"/></radialGradient><radialGradient id="sf-experimental-riemannian-H" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cbd5e1"/></radialGradient><radialGradient id="sf-experimental-riemannian-S" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#b45309"/></radialGradient><marker id="sf-experimental-riemannian-arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-rose)"/></marker></defs><text x="450" y="30" text-anchor="middle" font-size="15" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">Optimizing on the PSD set: the trace-2 slice of 2 × 2 symmetric matrices is a disk</text><rect x="24" y="50" width="452" height="340" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><circle cx="250" cy="220" r="130" fill="var(--sf-accent)" stroke="var(--sf-accent)" stroke-width="1.6" opacity="0.14"/><circle cx="250" cy="220" r="130" fill="none" stroke="var(--sf-accent)" stroke-width="1.6"/><text x="250" y="372" text-anchor="middle" font-size="9.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">u² + v² ≤ 1  ⇔  X ⪰ 0 · boundary = rank 1</text><circle cx="438.5" cy="148.5" r="6" fill="var(--sf-rose)"/><text x="434.5" y="138.5" text-anchor="end" font-size="9.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">target D (indefinite)</text><path d="M353.9,187.5 L374.2,178.2" fill="none" stroke="var(--sf-warm)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="374.2244317184" cy="178.1656468992" r="3" fill="var(--sf-warm)"/><path d="M373.2,178.5 L388.9,171.3" fill="none" stroke="var(--sf-warm)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="388.87308847023127" cy="171.30771902437363" r="3" fill="var(--sf-warm)"/><path d="M372.7,177.0 L388.5,170.1" fill="none" stroke="var(--sf-warm)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="388.47504180591363" cy="170.14952769613842" r="3" fill="var(--sf-warm)"/><path d="M372.3,176.0 L388.2,169.4" fill="none" stroke="var(--sf-warm)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="388.19979240973794" cy="169.3748390839304" r="3" fill="var(--sf-warm)"/><path d="M372.1,175.3 L388.0,168.9" fill="none" stroke="var(--sf-warm)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="388.0114109846632" cy="168.85610228483623" r="3" fill="var(--sf-warm)"/><path d="M371.9,174.8 L387.9,168.5" fill="none" stroke="var(--sf-warm)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="387.88333190370247" cy="168.5084830836092" r="3" fill="var(--sf-warm)"/><path d="M371.8,174.5 L387.8,168.3" fill="none" stroke="var(--sf-warm)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="387.7966259153511" cy="168.2754083032107" r="3" fill="var(--sf-warm)"/><path d="M371.7,174.3 L387.7,168.1" fill="none" stroke="var(--sf-warm)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="387.73809427748483" cy="168.1190761206801" r="3" fill="var(--sf-warm)"/><path d="M185.0,265.5 L245.8,237.4 L292.1,216.1 L327.2,199.9 L353.9,187.5 L373.2,178.5 L372.7,177.0 L372.3,176.0 L372.1,175.3 L371.9,174.8 L371.8,174.5 L371.7,174.3 L371.7,174.2" fill="none" stroke="var(--sf-violet)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="185.0" cy="265.5" r="4" fill="var(--sf-violet)"/><circle cx="245.84" cy="237.42" r="4" fill="var(--sf-violet)"/><circle cx="292.0784" cy="216.0792" r="4" fill="var(--sf-violet)"/><circle cx="327.219584" cy="199.86019199999998" r="4" fill="var(--sf-violet)"/><circle cx="353.92688384" cy="187.53374592" r="4" fill="var(--sf-violet)"/><circle cx="373.2014321976727" cy="178.51015661101795" r="4" fill="var(--sf-violet)"/><circle cx="372.67768658672844" cy="176.9862206528137" r="4" fill="var(--sf-violet)"/><circle cx="372.31551632860254" cy="175.96689353148736" r="4" fill="var(--sf-violet)"/><circle cx="372.0676460324516" cy="175.2843451116266" r="4" fill="var(--sf-violet)"/><circle cx="371.8991209259243" cy="174.82695142580158" r="4" fill="var(--sf-violet)"/><circle cx="371.7850340991462" cy="174.52027408317198" r="4" fill="var(--sf-violet)"/><circle cx="371.70801878616425" cy="174.31457384300012" r="4" fill="var(--sf-violet)"/><circle cx="371.65612627384724" cy="174.17656778413755" r="4" fill="var(--sf-violet)"/><circle cx="371.54967842131185" cy="173.89494956432998" r="7" fill="none" stroke="var(--sf-accent2)" stroke-width="2.4" class="sf-pulse"/><text x="381.54967842131185" y="191.89494956432998" text-anchor="start" font-size="9.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">optimum = P₊(D)</text><text x="179.0" y="281.5" text-anchor="end" font-size="9.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">start</text><text x="60" y="80" text-anchor="start" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">dashed orange: raw step leaves the set</text><text x="60" y="96" text-anchor="start" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">violet: retracted iterates stay feasible</text><rect x="496" y="50" width="380" height="340" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><text x="512" y="76" text-anchor="start" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">on the real problem (metric matrix G)</text><rect x="510" y="88" width="352" height="26" rx="7" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="520" y="105" text-anchor="start" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">manifold</text><text x="852" y="105" text-anchor="end" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">{X ⪰ 0, rank X = r}</text><rect x="510" y="120" width="352" height="26" rx="7" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="520" y="137" text-anchor="start" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">Riemannian gradient</text><text x="852" y="137" text-anchor="end" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">grad f = P_T(∇f)</text><rect x="510" y="152" width="352" height="26" rx="7" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="520" y="169" text-anchor="start" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">Stiefel tangent proj.</text><text x="852" y="169" text-anchor="end" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">ξ − X·sym(Xᵀξ)</text><rect x="510" y="184" width="352" height="26" rx="7" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="520" y="201" text-anchor="start" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">retraction</text><text x="852" y="201" text-anchor="end" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">P₊(X + ξ + ½ ξ X⁻¹ ξ)</text><rect x="510" y="216" width="352" height="26" rx="7" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="520" y="233" text-anchor="start" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">P₊</text><text x="852" y="233" text-anchor="end" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">zero the negative eigenvalues</text><rect x="510" y="248" width="352" height="26" rx="7" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="520" y="265" text-anchor="start" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">L-BFGS</text><text x="852" y="265" text-anchor="end" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">m = 5 pairs, vector transport</text><rect x="510" y="280" width="352" height="26" rx="7" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="520" y="297" text-anchor="start" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">line search</text><text x="852" y="297" text-anchor="end" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">Armijo along the geodesic</text><text x="686" y="344" text-anchor="middle" font-size="9.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">vs SciPy L-BFGS-B: projection 8.2e−12,</text><text x="686" y="362" text-anchor="middle" font-size="9.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">objective/gradient 1.2e−16</text>
</svg>

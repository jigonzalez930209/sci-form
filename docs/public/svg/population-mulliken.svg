0" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">H</text><rect x="382" y="140" width="20.0" height="20" rx="4" fill="none" stroke="var(--sf-line)" stroke-width="1"/><rect x="382" y="140" width="8.32" height="20" rx="4" fill="var(--sf-violet)" stroke="none" stroke-width="1.4" class="sf-rise" opacity="0.6"/><text x="408.0" y="154" text-anchor="start" font-size="9.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">0.416 e⁻  (Z = 1)</text><text x="366" y="194" text-anchor="middle" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">H</text><rect x="382" y="180" width="20.0" height="20" rx="4" fill="none" stroke="var(--sf-line)" stroke-width="1"/><rect x="382" y="180" width="8.32" height="20" rx="4" fill="var(--sf-violet)" stroke="none" stroke-width="1.4" class="sf-rise" opacity="0.6"/><text x="408.0" y="194" text-anchor="start" font-size="9.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">0.416 e⁻  (Z = 1)</text><text x="494" y="250" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">Tr(PS) = 7.168 + 0.416 + 0.416 = 8</text><text x="494" y="270" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">= N_electrons → Σ q_A = 0</text><text x="494" y="300" text-anchor="middle" font-size="9.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">outline = Z (valence electrons)</text><rect x="664" y="50" width="212" height="300" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><text x="770" y="74" 
f-muted)">y</text><text x="140" y="94" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">y</text><rect x="66" y="160" width="28" height="28" rx="3" fill="var(--sf-accent)" stroke="none" stroke-width="1.4" opacity="0.25"/><rect x="96" y="160" width="28" height="28" rx="3" fill="var(--sf-accent)" stroke="none" stroke-width="1.4" opacity="0.25"/><rect x="126" y="160" width="28" height="28" rx="3" fill="var(--sf-violet)" stroke="none" stroke-width="1.4" opacity="0.8"/><rect x="156" y="160" width="28" height="28" rx="3" fill="var(--sf-accent)" stroke="none" stroke-width="1.4" opacity="0.25"/><rect x="186" y="160" width="28" height="28" rx="3" fill="var(--sf-warm)" stroke="none" stroke-width="1.4" opacity="0.45"/><rect x="216" y="160" width="28" height="28" rx="3" fill="var(--sf-warm)" stroke="none" stroke-width="1.4" opacity="0.45"/><text x="56" y="209" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">z</text><text x="170" y="94" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">z</text><rect x="66" y="190" width="28" height="28" rx="3" fill="var(--sf-accent)" stroke="none" stroke-width="1.4" opacity="0.25"/><rect x="96" y="190" width="28" height="28" rx="3" fill="var(--sf-accent)" stroke="none" stroke-width="1.4" opacity="0.25"/><rect x="126" y="190" width="28" height="28" rx="3" fill="var(--sf-accent)" stroke="none" stroke-width="1.4" opacity="0.25"/><rect x="156" y="190" width="28" height="28" rx="3" fill="var(--sf-violet)" stroke="none" stroke-width="1.4" opacity="0.8"/><rect x="186" y="190" width="28" height="28" rx="3" fill="var(--sf-warm)" stroke="none" stroke-width="1.4" opacity="0.45"/><rect x="216" y="190" width="28" height="28" rx="3" fill="var
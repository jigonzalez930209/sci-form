-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">φ (°)</text><text x="450" y="326" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">Illustrative histograms for sp³–sp³ bonds · skip refinement when initial E &lt; 10⁻⁵ · result goes to validation</text>

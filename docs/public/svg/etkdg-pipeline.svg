<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Distance geometry plus CSD torsion preferences plus force-field refinement produces the ETKDG conformer.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-etkdg-pipeline-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-etkdg-pipeline-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-etkdg-pipeline-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="800" height="300" fill="url(#sf-etkdg-pipeline-glow)" stroke="none"/>
<rect x="40" y="80" width="210" height="160" rx="16" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="145" y="108" text-anchor="middle" font-size="12" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">distance geometry</text><rect x="75" y="119" width="78" height="78" rx="10" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="1.4"/><rect x="82" y="126" width="14.2" height="14.2" rx="1.8" fill="var(--sf-accent)" stroke="none" stroke-width="1.4" opacity="0.82"/><rect x="98" y="126" width="14.2" height="14.2" rx="1.8" fill="var(--sf-soft)" stroke="none" stroke-width="1.4" opacity="0.34"/><rect x="114" y="126" width="14.2" height="14.2" rx="1.8" fill="var(--sf-soft)" stroke="none" stroke-width="1.4" opacity="0.34"/><rect x="130" y="126" width="14.2" height="14.2" rx="1.8" fill="var(--sf-accent)" stroke="none" stroke-width="1.4" opacity="0.82"/><rect x="82" y="142" width="14.2" height="14.2" rx="1.8" fill="var(--sf-soft)" stroke="none" stroke-width="1.4" opacity="0.34"/><rect x="98" y="142" width="14.2" height="14.2" rx="1.8" fill="var(--sf-accent)" stroke="none" stroke-width="1.4" opacity="0.82"/><rect x="114" y="142" width="14.2" height="14.2" rx="1.8" fill="var(--sf-soft)" stroke="none" stroke-width="1.4" opacity="0.34"/><rect x="130" y="142" width="14.2" height="14.2" rx="1.8" fill="var(--sf-soft)" stroke="none" stroke-width="1.4" opacity="0.34"/><rect x="82" y="158" width="14.2" height="14.2" rx="1.8" fill="var(--sf-soft)" stroke="none" stroke-width="1.4" opacity="0.34"/><rect x="98" y="158" width="14.2" height="14.2" rx="1.8" fill="var(--sf-accent)" stroke="none" stroke-width="1.4" opacity="0.82"/><rect x="114" y="158" width="14.2" height="14.2" rx="1.8" fill="var(--sf-soft)" stroke="none" stroke-width="1.4" opacity="0.34"/><rect x="130" y="158" width="14.2" height="14.2" rx="1.8" fill="var(--sf-soft)" stroke="none" stroke-width="1.4" opacity="0.34"/><rect x="82" y="174" width="14.2" height="14.2" rx="1.8" fill="var(--sf-soft)" stroke="none" stroke-width="1.4" opacity="0.34"/><rect x="98" y="174" width="14.2" height="14.2" rx="1.8" fill="var(--sf-soft)" stroke="none" stroke-width="1.4" opacity="0.34"/><rect x="114" y="174" width="14.2" height="14.2" rx="1.8" fill="var(--sf-accent)" stroke="none" stroke-width="1.4" opacity="0.82"/><rect x="130" y="174" width="14.2" height="14.2" rx="1.8" fill="var(--sf-soft)" stroke="none" stroke-width="1.4" opacity="0.34"/><path d="M165,190 L220,190" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-etkdg-pipeline-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.2s" repeatCount="indefinite" path="M165,190 L220,190"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle><rect x="245" y="80" width="250" height="160" rx="16" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="370" y="108" text-anchor="middle" font-size="12" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">torsion knowledge</text><path d="M280,130 L280,208 M280,208 L460,208" fill="none" stroke="var(--sf-line)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M280,208 l4,-4 M280,208 l-4,-4" fill="none" stroke="var(--sf-line)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M280,130 l-4,4 M280,130 l4,4" fill="none" stroke="var(--sf-line)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="295" y="184" width="12" height="24" rx="3" fill="var(--sf-accent2)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d1" opacity="0.65"/><rect x="317" y="168" width="12" height="40" rx="3" fill="var(--sf-accent2)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d2" opacity="0.65"/><rect x="339" y="150" width="12" height="58" rx="3" fill="var(--sf-accent2)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d3" opacity="0.65"/><rect x="361" y="174" width="12" height="34" rx="3" fill="var(--sf-accent2)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d4" opacity="0.65"/><rect x="383" y="158" width="12" height="50" rx="3" fill="var(--sf-accent2)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d5" opacity="0.65"/><rect x="405" y="186" width="12" height="22" rx="3" fill="var(--sf-accent2)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d6" opacity="0.65"/><rect x="427" y="172" width="12" height="36" rx="3" fill="var(--sf-accent2)" stroke="var(--sf-line)" stroke-width="1.4" class="sf-rise sf-d6" opacity="0.65"/><path d="M500,160 L550,160" fill="none" stroke="var(--sf-accent2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-etkdg-pipeline-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent2)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.4s" repeatCount="indefinite" path="M500,160 L550,160"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.4s" repeatCount="indefinite"/></circle><rect x="555" y="80" width="205" height="160" rx="16" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="657" y="108" text-anchor="middle" font-size="11.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">force-field refinement</text><g class="sf-spin"><path d="M664.90,127.83 L693.14,153.26 L685.24,190.43 L649.10,202.17 L620.86,176.74 L628.76,139.57 Z" fill="none" stroke="var(--sf-line)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="657" cy="165" r="21.28" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" opacity="0.75"/><circle cx="664.9006442510748" cy="127.83039117211538" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="693.1401476192158" cy="153.257354213752" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="685.239503368141" cy="190.4269630416366" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="649.0993557489252" cy="202.16960882788462" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="620.8598523807842" cy="176.742645786248" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="628.760496631859" cy="139.5730369583634" r="4.5" fill="var(--sf-ink)" opacity="0.85"/></g><rect x="320" y="258" width="130" height="22" rx="11.0" fill="var(--sf-soft)" stroke="var(--sf-accent)" stroke-width="1"/><text x="385.0" y="272.5" text-anchor="middle" font-size="10" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">ETKDG</text>
</svg>

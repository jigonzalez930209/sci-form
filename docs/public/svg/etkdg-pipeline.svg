 stroke="none" stroke-width="1.4" opacity="0.75"/><rect x="185.0" y="154.28571428571428" width="8.0" height="85.71428571428572" rx="1.5" fill="var(--sf-line)" stroke="none" stroke-width="1.4" opacity="0.75"/><rect x="195.0" y="137.14285714285717" width="8.0" height="102.85714285714285" rx="1.5" fill="var(--sf-line)" stroke="none" stroke-width="1.4" opacity="0.75"/><rect x="205.0" y="137.14285714285717" width="8.0" height="102.85714285714285" rx="1.5" fill="var(--sf-line)" stroke="none" stroke-width="1.4" opacity="0.75"/><rect x="215.0" y="154.28571428571428" width="8.0" height="85.71428571428572" rx="1.5" fill="var(--sf-line)" stroke="none" stroke-width="1.4" opacity="0.75"/><text x="44" y="252" text-anchor="middle" font-size="8" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">−180</text><text x="134.0" y="252" text-anchor="middle" font-size="8" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">0</text><text x="224" y="252" text-anchor="middle" font-size="8" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">180</text><text x="134" y="280" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">φ (°)</text><rect x="290" y="54" width="330" height="250" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><text x="455" y="78" text-anchor="middle" font-size="11.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">ETKDG 3D force field → BFGS (≤ 300 iter)</text><rect x="304" y="94" width="302" height="42" rx="9" fill="var(--sf-card2)" stroke="var(--sf-accent2)" stroke-width="1.1"/><text x="316" y="112" text-anchor="start" font-size="10.5" font-weight="700" font-family='
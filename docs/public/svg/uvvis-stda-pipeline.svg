t x="558" y="110" text-anchor="middle" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)" class="sf-rise sf-d4">oscillator</text><text x="558" y="128" text-anchor="middle" font-size="8.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)" class="sf-rise sf-d4">intensity</text><circle cx="558" cy="158" r="14" fill="var(--sf-soft)" stroke="var(--sf-warm)" stroke-width="1.5" class="sf-pulse"/><path d="M628,130 L646,130" fill="none" stroke="var(--sf-warm)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-uvvis-stda-pipeline-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-warm)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.6499999999999999s" repeatCount="indefinite" path="M628,130 L646,130"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.6499999999999999s" repeatCount="indefinite"/></circle><rect x="646" y="70" width="132" height="120" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><rect x="647.5" y="71.5" width="129" height="4" rx="2" fill="var(--sf-rose)" stroke="none" stroke-width="1.4"/><text x="712" y="110" text-anchor="middle" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)" class="sf-rise sf-d5">spectrum</text><text x="712" y="128" text-anchor="middle" font-size="8.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)" class="sf-rise sf-d5">ε(λ)</text><circle cx="712" cy="158" r="14" fill="var(--sf-soft)" stroke="var(--sf-rose)" stroke-width="1.5" class="sf-pulse"/><path d="M650,145 L650,190 M650,190 L770,190" fill="none" stroke="var(--sf-line)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M650,190 l4,-4 M650,190 
<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" width="900" height="386" role="img" aria-label="Water dipole from sci-form Mulliken charges and coordinates: the q·y sum gives −0.675 e·Å, which is 3.24 D, larger than the experimental 1.85 D because EHT charges are exaggerated.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-dipole-vector-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-dipole-vector-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-dipole-vector-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="900" height="386" fill="url(#sf-dipole-vector-glow)" stroke="none"/>
<defs><radialGradient id="sf-dipole-vector-C" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#1e293b"/></radialGradient><radialGradient id="sf-dipole-vector-O" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fda4af"/><stop offset="100%" stop-color="#be123c"/></radialGradient><radialGradient id="sf-dipole-vector-N" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#1d4ed8"/></radialGradient><radialGradient id="sf-dipole-vector-H" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cbd5e1"/></radialGradient><radialGradient id="sf-dipole-vector-S" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#b45309"/></radialGradient><marker id="sf-dipole-vector-arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-rose)"/></marker></defs><text x="450" y="30" text-anchor="middle" font-size="15" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">μ = Σ q_A R_A for water (sci-form Mulliken charges, Å)</text><rect x="24" y="50" width="420" height="320" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><path d="M54,170 L414,170" fill="none" stroke="var(--sf-line)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><path d="M234,60 L234,340" fill="none" stroke="var(--sf-line)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><text x="410" y="164" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">x</text><text x="242" y="70" text-anchor="start" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">y</text><path d="M233.3,123.8 L138.5,193.4" fill="none" stroke="var(--sf-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M233.3,123.8 L330.2,192.9" fill="none" stroke="var(--sf-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="233.316" cy="123.77600000000001" r="16" fill="url(#sf-dipole-vector-O)"/><text x="233.316" y="129.536" text-anchor="middle" font-size="15" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">O</text><circle cx="138.468" cy="193.364" r="11.2" fill="url(#sf-dipole-vector-H)" stroke="var(--sf-line)" stroke-width="0.6"/><circle cx="330.216" cy="192.86" r="11.2" fill="url(#sf-dipole-vector-H)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="233.316" y="99.77600000000001" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">-1.168</text><text x="138.468" y="225.364" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">+0.584</text><text x="330.216" y="224.86" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">+0.584</text><path d="M267.3,131.8 L269.0,243.0" fill="none" stroke="var(--sf-warm)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="sf-pulse"/><path d="M261.0,241.0 L269.0,255.0 L277.0,241.0 Z" fill="var(--sf-warm)" stroke="var(--sf-warm)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="277.31600000000003" y="183.776" text-anchor="start" font-size="13" font-weight="800" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">μ</text><text x="234" y="352" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">arrow: from negative (O) toward positive (H) charge</text><rect x="464" y="50" width="412" height="320" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><text x="480" y="74" text-anchor="start" font-size="11.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">component sums (e·Å)</text><text x="484" y="100" text-anchor="start" font-size="9.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">atom</text><text x="548" y="100" text-anchor="start" font-size="9.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">q</text><text x="620" y="100" text-anchor="start" font-size="9.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">x</text><text x="692" y="100" text-anchor="start" font-size="9.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">y</text><text x="774" y="100" text-anchor="start" font-size="9.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">q·y</text><text x="484" y="124" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">O</text><text x="548" y="124" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">-1.168</text><text x="620" y="124" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">-0.006</text><text x="692" y="124" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">+0.385</text><text x="774" y="124" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">-0.450</text><text x="484" y="148" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">H</text><text x="548" y="148" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">+0.584</text><text x="620" y="148" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">-0.796</text><text x="692" y="148" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">-0.195</text><text x="774" y="148" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">-0.114</text><text x="484" y="172" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">H</text><text x="548" y="172" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">+0.584</text><text x="620" y="172" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">+0.802</text><text x="692" y="172" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">-0.191</text><text x="774" y="172" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">-0.111</text><path d="M480,192 L860,192" fill="none" stroke="var(--sf-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="484" y="212" text-anchor="start" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">μ_y = Σ q·y</text><text x="774" y="212" text-anchor="start" font-size="10" font-weight="700" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">-0.675</text><text x="484" y="244" text-anchor="start" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">× 4.80321 → μ_y = -3.24 D</text><text x="484" y="266" text-anchor="start" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">μ_x = +0.04 D, μ_z = 0</text><text x="484" y="292" text-anchor="start" font-size="13" font-weight="800" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">|μ| = 3.24 D</text><text x="484" y="316" text-anchor="start" font-size="9.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">experiment 1.85 D: EHT charges are too large,</text><text x="484" y="332" text-anchor="start" font-size="9.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">so use EHT dipoles for trends, not values</text>
</svg>

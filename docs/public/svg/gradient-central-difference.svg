<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="system-ui, sans-serif" role="img" aria-label="Central-difference gradient: displace one coordinate by plus and minus h, run the SCF twice, subtract the energies and divide by 2h">
  <style>
    @media (prefers-reduced-motion: reduce) { .cd-anim * { animation: none !important; } }
    .cd-atom-move { animation: cd-wiggle 6s ease-in-out infinite; }
    @keyframes cd-wiggle { 0%,100% { transform: translate(0,0); } 25% { transform: translate(14px,0); } 50% { transform: translate(0,0); } 75% { transform: translate(-14px,0); } }
    .cd-plus  { animation: cd-pulse-a 6s steps(1,end) infinite; }
    .cd-minus { animation: cd-pulse-b 6s steps(1,end) infinite; }
    @keyframes cd-pulse-a { 0%,100% { opacity:.25; } 12%,38% { opacity:1; } 50% { opacity:.25; } }
    @keyframes cd-pulse-b { 0%,50% { opacity:.25; } 62%,88% { opacity:1; } 100% { opacity:.25; } }
    .cd-result { animation: cd-glow 6s ease-in-out infinite; }
    @keyframes cd-glow { 0%,40% { opacity:.35; } 55%,100% { opacity:1; } }
  </style>
  <defs>
    <marker id="cd-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker>
  </defs>
  <g class="cd-anim">
  <rect width="820" height="330" fill="white" rx="12" stroke="#e2e8f0"/>
  <text x="410" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Energy-consistent gradient: central differences of the reported energy</text>
  <text x="410" y="46" text-anchor="middle" font-size="10.5" fill="#64748b">PM3 · xTB (GFN2) · same energy function the matching compute_* call returns — 2 SCF runs per Cartesian coordinate</text>

  <!-- molecule -->
  <rect x="20" y="64" width="210" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="125" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">geometry R (Å)</text>
  <line x1="90" y1="190" x2="125" y2="130" stroke="#94a3b8" stroke-width="3"/>
  <line x1="160" y1="190" x2="125" y2="130" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="125" cy="130" r="17" fill="#ef4444"/><text x="125" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="white">O</text>
  <circle cx="90" cy="190" r="11" fill="#e2e8f0" stroke="#94a3b8"/><text x="90" y="194" text-anchor="middle" font-size="10" fill="#334155">H</text>
  <g class="cd-atom-move"><circle cx="160" cy="190" r="11" fill="#3b82f6"/><text x="160" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="white">H</text></g>
  <text x="125" y="226" text-anchor="middle" font-size="10" fill="#475569">x_k → x_k ± h,  h = 5·10⁻⁴ Å</text>
  <text x="125" y="241" text-anchor="middle" font-size="10" fill="#475569">one coordinate at a time</text>

  <!-- SCF boxes -->
  <path d="M232,150 L272,120" stroke="#64748b" stroke-width="1.5" marker-end="url(#cd-arrow)" fill="none"/>
  <path d="M232,180 L272,208" stroke="#64748b" stroke-width="1.5" marker-end="url(#cd-arrow)" fill="none"/>
  <g class="cd-plus"><rect x="276" y="86" width="180" height="62" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="366" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">SCF at R + h·e_k</text>
    <text x="366" y="128" text-anchor="middle" font-size="12" fill="#1d4ed8">E₊</text></g>
  <g class="cd-minus"><rect x="276" y="184" width="180" height="62" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="366" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">SCF at R − h·e_k</text>
    <text x="366" y="226" text-anchor="middle" font-size="12" fill="#b91c1c">E₋</text></g>
  <path d="M458,118 L508,150" stroke="#64748b" stroke-width="1.5" marker-end="url(#cd-arrow)" fill="none"/>
  <path d="M458,215 L508,184" stroke="#64748b" stroke-width="1.5" marker-end="url(#cd-arrow)" fill="none"/>

  <!-- result -->
  <g class="cd-result"><rect x="512" y="116" width="290" height="104" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="657" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">∂E/∂x_k ≈ (E₊ − E₋) / 2h</text>
    <text x="657" y="164" text-anchor="middle" font-size="10.5" fill="#15803d">truncation error O(h²) ≈ 5·10⁻⁶ eV/Å</text>
    <text x="657" y="182" text-anchor="middle" font-size="10.5" fill="#15803d">independent coordinates → rayon, bit-identical</text>
    <text x="657" y="200" text-anchor="middle" font-size="10.5" fill="#15803d">result: Vec&lt;[f64;3]&gt;, eV/Å</text></g>

  <!-- footer -->
  <rect x="20" y="268" width="782" height="48" rx="8" fill="#fefce8" stroke="#eab308"/>
  <text x="34" y="288" font-size="10.5" fill="#713f12"><tspan font-weight="bold">Cost:</tspan> 6·N SCF runs for N atoms (+1 for the reference energy).  <tspan font-weight="bold">Why not analytic:</tspan> the previous Hellmann-Feynman code differentiated a simplified model,</text>
  <text x="34" y="304" font-size="10.5" fill="#713f12">not the energy the API reports, and missed it by 18 eV/Å (PM3, H₂O₂) and 209–263 eV/Å (xTB). An analytic NDDO/GFN2 gradient is future work.</text>
  </g>
</svg>

<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-label="A central difference displaces one coordinate by plus and minus h and divides the energy difference by 2h.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-gradient-central-difference-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-gradient-central-difference-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-gradient-central-difference-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="760" height="310" fill="url(#sf-gradient-central-difference-glow)" stroke="none"/>
<circle cx="250" cy="155" r="16" fill="var(--sf-rose)" opacity="0.8"/><text x="250" y="160" text-anchor="middle" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">A</text><circle cx="150" cy="155" r="13" fill="var(--sf-accent)" class="sf-float" opacity="0.7"/><text x="150" y="160" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">−h</text><circle cx="350" cy="155" r="13" fill="var(--sf-accent2)" class="sf-float sf-d2" opacity="0.7"/><text x="350" y="160" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">+h</text><path d="M170,155 L233,155" fill="none" stroke="var(--sf-line)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-gradient-central-difference-arrow)"/><path d="M267,155 L330,155" fill="none" stroke="var(--sf-line)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-gradient-central-difference-arrow)"/><text x="250" y="200" text-anchor="middle" font-size="9.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">displace one coordinate</text><rect x="60" y="230" width="180" height="52" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="150" y="262" text-anchor="middle" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">E(R − h)</text><rect x="260" y="230" width="180" height="52" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="350" y="262" text-anchor="middle" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">E(R + h)</text><path d="M150,210 L150,226" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-gradient-central-difference-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.2s" repeatCount="indefinite" path="M150,210 L150,226"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle><path d="M350,210 L350,226" fill="none" stroke="var(--sf-accent2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-gradient-central-difference-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent2)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.4s" repeatCount="indefinite" path="M350,210 L350,226"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.4s" repeatCount="indefinite"/></circle><path d="M450,256 L545,256" fill="none" stroke="var(--sf-warm)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-gradient-central-difference-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-warm)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.6s" repeatCount="indefinite" path="M450,256 L545,256"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.6s" repeatCount="indefinite"/></circle><rect x="555" y="220" width="170" height="72" rx="12" fill="var(--sf-card)" stroke="var(--sf-warm)" stroke-width="1.4"/><text x="640" y="252" text-anchor="middle" font-size="16" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">∂E/∂x</text><text x="640" y="272" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-muted)">(E₊ − E₋) / 2h</text><rect x="300" y="36" width="190" height="22" rx="11.0" fill="var(--sf-soft)" stroke="var(--sf-accent)" stroke-width="1"/><text x="395.0" y="50.5" text-anchor="middle" font-size="10" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">two energy evaluations</text>
</svg>

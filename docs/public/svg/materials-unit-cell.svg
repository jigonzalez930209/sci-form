<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" role="img" aria-label="A triclinic cell with a 5, b 6, c 7 angstrom and angles 80, 95, 105 degrees, its lattice matrix, volume 199.6 cubic angstrom and the fractional-to-Cartesian mapping of the cell center.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-materials-unit-cell-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-materials-unit-cell-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-materials-unit-cell-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="900" height="396" fill="url(#sf-materials-unit-cell-glow)" stroke="none"/>
<defs><radialGradient id="sf-materials-unit-cell-C" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#1e293b"/></radialGradient><radialGradient id="sf-materials-unit-cell-O" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fda4af"/><stop offset="100%" stop-color="#be123c"/></radialGradient><radialGradient id="sf-materials-unit-cell-N" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#1d4ed8"/></radialGradient><radialGradient id="sf-materials-unit-cell-H" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cbd5e1"/></radialGradient><radialGradient id="sf-materials-unit-cell-S" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#b45309"/></radialGradient><marker id="sf-materials-unit-cell-arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-rose)"/></marker></defs><text x="450" y="30" text-anchor="middle" font-size="15" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">Triclinic cell a = 5, b = 6, c = 7 Å · α = 80°, β = 95°, γ = 105°</text><rect x="24" y="50" width="420" height="330" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><path d="M280.0,300.0 L301.1,255.5" fill="none" stroke="var(--sf-line)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M280.0,300.0 L276.4,126.3" fill="none" stroke="var(--sf-line)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M181.1,255.5 L301.1,255.5" fill="none" stroke="var(--sf-line)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M181.1,255.5 L177.5,81.8" fill="none" stroke="var(--sf-line)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M156.4,126.3 L276.4,126.3" fill="none" stroke="var(--sf-line)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M156.4,126.3 L177.5,81.8" fill="none" stroke="var(--sf-line)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M301.1,255.5 L297.5,81.8" fill="none" stroke="var(--sf-line)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M276.4,126.3 L297.5,81.8" fill="none" stroke="var(--sf-line)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M177.5,81.8 L297.5,81.8" fill="none" stroke="var(--sf-line)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M160.0,300.0 L280.0,300.0" fill="none" stroke="var(--sf-accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280.0" cy="300.0" r="4" fill="var(--sf-accent)"/><text x="290.0" y="304.0" text-anchor="start" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">a = 5 Å</text><path d="M160.0,300.0 L181.1,255.5" fill="none" stroke="var(--sf-accent2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="181.14925147919985" cy="255.49013792459974" r="4" fill="var(--sf-accent2)"/><text x="191.14925147919985" y="259.4901379245997" text-anchor="start" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">b = 6 Å</text><path d="M160.0,300.0 L156.4,126.3" fill="none" stroke="var(--sf-violet)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="156.39486649044503" cy="126.30610994224364" r="4" fill="var(--sf-violet)"/><text x="166.39486649044503" y="130.30610994224364" text-anchor="start" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">c = 7 Å</text><circle cx="228.77205898482245" cy="190.8981239334217" r="6" fill="var(--sf-warm)" class="sf-pulse"/><text x="238.77205898482245" y="182.8981239334217" text-anchor="start" font-size="9.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">f = (½, ½, ½)</text><text x="234" y="366" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">α: b∧c · β: a∧c · γ: a∧b</text><rect x="464" y="50" width="412" height="330" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><text x="480" y="74" text-anchor="start" font-size="11.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">lattice matrix M (rows a, b, c), Å</text><rect x="524" y="88" width="80" height="26" rx="5" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="564" y="105" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">+5.000</text><rect x="610" y="88" width="80" height="26" rx="5" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="650" y="105" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">+0.000</text><rect x="696" y="88" width="80" height="26" rx="5" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="736" y="105" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">+0.000</text><text x="504" y="105" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">a</text><rect x="524" y="118" width="80" height="26" rx="5" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="564" y="135" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">-1.553</text><rect x="610" y="118" width="80" height="26" rx="5" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="650" y="135" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">+5.796</text><rect x="696" y="118" width="80" height="26" rx="5" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="736" y="135" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">+0.000</text><text x="504" y="135" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">b</text><rect x="524" y="148" width="80" height="26" rx="5" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="564" y="165" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">-0.610</text><rect x="610" y="148" width="80" height="26" rx="5" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="650" y="165" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">+1.095</text><rect x="696" y="148" width="80" height="26" rx="5" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="0.6"/><text x="736" y="165" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">+6.887</text><text x="504" y="165" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">c</text><text x="480" y="200" text-anchor="start" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">V = det M = 199.57 Å³</text><text x="480" y="228" text-anchor="start" font-size="10.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">r = Mᵀ f = (1.42, 3.45, 3.44) Å</text><text x="480" y="248" text-anchor="start" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">f = (M⁻¹)ᵀ r  (inverse)</text><text x="480" y="280" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">wrap: f ← f − ⌊f⌋  e.g. (1.2, −0.3, 0.5) → (0.2, 0.7, 0.5)</text><text x="480" y="300" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">minimum image: Δf ← Δf − round(Δf)</text><text x="480" y="320" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">supercell n_a×n_b×n_c: f ← (f₀ + (i,j,k)) / n</text><text x="480" y="352" text-anchor="start" font-size="9.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">a along x, b in the xy-plane, c fills z</text>
</svg>

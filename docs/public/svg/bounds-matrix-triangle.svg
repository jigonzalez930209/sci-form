<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Law of cosines for 1-3 bounds in ethanol: C–C 1.51 Å, C–O 1.41 Å and 109.47° give 2.39 Å with ±0.04 Å tolerance; reference 1-3 distances for sp3, sp2 and sp middle atoms.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-bounds-matrix-triangle-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-bounds-matrix-triangle-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-bounds-matrix-triangle-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="900" height="360" fill="url(#sf-bounds-matrix-triangle-glow)" stroke="none"/>
<defs><radialGradient id="sf-bounds-matrix-triangle-C" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#1e293b"/></radialGradient><radialGradient id="sf-bounds-matrix-triangle-O" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fda4af"/><stop offset="100%" stop-color="#be123c"/></radialGradient><radialGradient id="sf-bounds-matrix-triangle-N" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#1d4ed8"/></radialGradient><radialGradient id="sf-bounds-matrix-triangle-H" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cbd5e1"/></radialGradient><radialGradient id="sf-bounds-matrix-triangle-S" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#b45309"/></radialGradient><marker id="sf-bounds-matrix-triangle-arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-rose)"/></marker></defs><text x="450" y="32" text-anchor="middle" font-size="15" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">1-3 bounds from the law of cosines — ethanol C–C–O</text><path d="M48.3,230.0 L230,230 L286.3,70.8" fill="none" stroke="var(--sf-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M48.3,230.0 L286.3,70.8" fill="none" stroke="var(--sf-warm)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" class="sf-flow"/><path d="M200,230 A30,30 0 0 1 240.0,201.7" fill="none" stroke="var(--sf-violet)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="224" y="192" text-anchor="end" font-size="10.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">θ = 109.47°</text><text x="139.16" y="254" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">d₁ = 1.51 Å (C–C)</text><text x="270.13830435971056" y="154.40746123058838" text-anchor="start" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent)">d₂ = 1.41 Å (C–O)</text><text x="157.29830435971058" y="142.40746123058838" text-anchor="end" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">d₁₃ = 2.39 Å</text><circle cx="48.31999999999999" cy="230" r="12" fill="url(#sf-bounds-matrix-triangle-C)"/><text x="48.31999999999999" y="234.32" text-anchor="middle" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">C</text><circle cx="230" cy="230" r="12" fill="url(#sf-bounds-matrix-triangle-C)"/><text x="230" y="234.32" text-anchor="middle" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">C</text><circle cx="286.2766087194212" cy="70.81492246117676" r="12" fill="url(#sf-bounds-matrix-triangle-O)"/><text x="286.2766087194212" y="75.13492246117676" text-anchor="middle" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">O</text><rect x="470" y="64" width="400" height="92" rx="12" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.2"/><text x="670" y="92" text-anchor="middle" font-size="12.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">d₁₃ = √(d₁² + d₂² − 2 d₁ d₂ cos θ)</text><text x="670" y="116" text-anchor="middle" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-muted)">= √(1.514² + 1.407² − 2·1.514·1.407·cos 109.47°)</text><text x="670" y="140" text-anchor="middle" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">bounds [2.35, 2.43] Å  (± 0.04)</text><text x="470" y="184" text-anchor="start" font-size="10.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">θ by hybridization of the middle atom (C–C–C, UFF radii):</text><rect x="476" y="212" width="120" height="106" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1"/><path d="M508.2,267.6 L536,248 L563.8,267.6" fill="none" stroke="var(--sf-ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M508.2,267.6 L563.8,267.6" fill="none" stroke="var(--sf-warm)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="508.239325348716" cy="267.63020486152806" r="6" fill="url(#sf-bounds-matrix-triangle-C)"/><circle cx="536" cy="248" r="6" fill="url(#sf-bounds-matrix-triangle-C)"/><circle cx="563.760674651284" cy="267.63020486152806" r="6" fill="url(#sf-bounds-matrix-triangle-C)"/><text x="536" y="230" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">sp³ · 109.47°</text><text x="536" y="304" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-warm)">d₁₃ = 2.47 Å</text><rect x="610" y="212" width="120" height="106" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1"/><path d="M640.6,265.0 L670,248 L699.4,265.0" fill="none" stroke="var(--sf-ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M640.6,265.0 L699.4,265.0" fill="none" stroke="var(--sf-warm)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="640.555136271329" cy="265.0" r="6" fill="url(#sf-bounds-matrix-triangle-C)"/><circle cx="670" cy="248" r="6" fill="url(#sf-bounds-matrix-triangle-C)"/><circle cx="699.444863728671" cy="265.0" r="6" fill="url(#sf-bounds-matrix-triangle-C)"/><text x="670" y="230" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">sp² · 120°</text><text x="670" y="304" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-warm)">d₁₃ = 2.54 Å</text><rect x="744" y="212" width="120" height="106" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1"/><path d="M770.0,248.0 L804,248 L838.0,248.0" fill="none" stroke="var(--sf-ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M770.0,248.0 L838.0,248.0" fill="none" stroke="var(--sf-warm)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="770" cy="248" r="6" fill="url(#sf-bounds-matrix-triangle-C)"/><circle cx="804" cy="248" r="6" fill="url(#sf-bounds-matrix-triangle-C)"/><circle cx="838" cy="248" r="6" fill="url(#sf-bounds-matrix-triangle-C)"/><text x="804" y="230" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">sp · 180°</text><text x="804" y="304" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-warm)">d₁₃ = 2.82 Å</text><text x="450" y="346" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">multiple paths → union: lowest lower bound, highest upper bound · ±0.04 doubled per large ring sp² atom</text>
</svg>

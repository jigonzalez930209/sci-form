chor="start" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">analytic</text><rect x="40" y="140" width="36" height="30" rx="8" fill="var(--sf-card)" stroke="var(--sf-accent)" stroke-width="1.2"/><text x="58.0" y="160" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">pm3</text><path d="M88,155 L324,155" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.15s" repeatCount="indefinite" path="M88,155 L324,155"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.15s" repeatCount="indefinite"/></circle><rect x="330" y="136" width="280" height="38" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.2"/><rect x="331.5" y="137.5" width="4" height="35" rx="2" fill="var(--sf-accent)" stroke="none" stroke-width="1.4"/><text x="346" y="160" text-anchor="start" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">MOPAC-parity PM3 (Z ≤ 17)</text><path d="M614,155 L636,155" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.25s" repeatCount="indefinite" path="M614,155 L636,155"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.25s" repeatCount="indefinite"/></circle><rect x="640" y="136" width="236" height="38" rx="10" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="1"/><text x="652" y="160" text-anchor="start" font-size="9" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">stationary density: rebuild H, G(P), E_nuc at R ± h</text><rect x="40" y="198" width="36" height="30" rx="8" fill="var(--sf-card)" stroke="var(--sf-violet)" stroke-width="1.2"/><text x="58.0" y="218" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">xtb</text><rect x="84" y="198" width="44" height="30" rx="8" fill="var(--sf-card)" stroke="var(--sf-violet)" stroke-width="1.2"/><text x="106.0" y="218" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">gfn2</text><rect x="136" y="198" width="52" height="30" rx="8" fill="var(--sf-card)" stroke="var(--sf-violet)" stroke-width="1.2"/><text x="162.0" y="218" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">gfn0*</text><path d="M200,213 L324,213" fill="none" stroke="var(--sf-violet)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-violet)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.3s" repeatCount="indefinite" path="M200,213 L324,213"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle><rect x="330" y="194" width="280" height="38" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.2"/><rect x="331.5" y="195.5" width="4" height="35" rx="2" fill="var(--sf-violet)" stroke="none" stroke-width="1.4"/><text x="346" y="218" text-anchor="start" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">GFN2-xTB (solve_gfn2)</text><path d="M614,213 L636,213" fill="none" stroke="var(--sf-violet)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-violet)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.4s" repeatCount="indefinite" path="M614,213 L636,213"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.4s" repeatCount="indefinite"/></circle><rect x="640" y="194" width="236" height="38" rx="10" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="1"/><text x="652" y="218" text-anchor="start" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">warm-started central differences</text><rect x="40" y="256" width="44" height="30" rx="8" fill="var(--sf-card)" stroke="var(--sf-warm)" stroke-width="1.2"/><text x="62.0" y="276" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">gfn1</text><path d="M96,271 L324,271" fill="none" stroke="var(--sf-warm)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-warm)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.44999999999999996s" repeatCount="indefinite" path="M96,271 L324,271"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.44999999999999996s" repeatCount="indefinite"/></circle><rect x="330" y="252" width="280" height="38" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.2"/><rect x="331.5" y="253.5" width="4" height="35" rx="2" fill="var(--sf-warm)" stroke="none" stroke-width="1.4"/><text x="346" y="276" text-anchor="start" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">GFN1-xTB (solve_gfn1)</text><path d="M614,271 L636,271" fill="none" stroke="var(--sf-warm)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-warm)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.5499999999999999s" repeatCount="indefinite" path="M614,271 L636,271"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.5499999999999999s" repeatCount="indefinite"/></circle><rect x="640" y="252" width="236" height="38" rx="10" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="1"/><text x="652" y="276" text-anchor="start" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">central differences</text><rect x="40" y="314" width="44" height="30" rx="8" fill="var(--sf-card)" stroke="var(--sf-rose)" stroke-width="1.2"/><text x="62.0" y="334" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">hf3c</text><path d="M96,329 L324,329" fill="none" stroke="var(--sf-rose)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-rose)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.6s" repeatCount="indefinite" path="M96,329 L324,329"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.6s" repeatCount="indefinite"/></circle><rect x="330" y="310" width="280" height="38" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.2"/><rect x="331.5" y="311.5" width="4" height="35" rx="2" fill="var(--sf-rose)" stroke="none" stroke-width="1.4"/><text x="346" y="334" text-anchor="start" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">HF-3c</text><path d="M614,329 L636,329" fill="none" stroke="var(--sf-rose)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-rose)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.7s" repeatCount="indefinite" path="M614,329 L636,329"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.7s" repeatCount="indefinite"/></circle><rect x="640" y="310" width="236" height="38" rx="10" fill="var(--sf-card2)" stroke="var(--sf-line)" stroke-width="1"/><text x="652" y="334" text-anchor="start" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">central differences</text><rect x="40" y="370" width="836" height="66" rx="12" fill="var(--sf-soft)" stroke="var(--sf-warm)" stroke-width="1.1"/><text x="56" y="392" text-anchor="start" font-size="9.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">* "gfn0" is only a legacy alias of the GFN2 surface. The faithful GFN0 is xtb::solve_gfn0 (Rust only, closed shell, no gradient).</text><text x="56" y="412" text-anchor="start" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">PM3 for Z &gt; 17 falls back to the legacy NDDO path (recorded in notes) with full central differences.</text><text x="56" y="428" text-anchor="start" font-size="9.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">Absolute energies are not comparable across backends (ethanol: −7146 kcal/mol xtb vs −14379 pm3).</text>
</svg>

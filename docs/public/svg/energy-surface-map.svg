<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="Every public method name maps to exactly one energy surface and one gradient path.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-energy-surface-map-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-energy-surface-map-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-energy-surface-map-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="800" height="350" fill="url(#sf-energy-surface-map-glow)" stroke="none"/>
<rect x="35" y="55" width="118" height="48" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="94" y="85" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">pm3</text><path d="M158,79 L225,79" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.0s" repeatCount="indefinite" path="M158,79 L225,79"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.0s" repeatCount="indefinite"/></circle><rect x="230" y="55" width="205" height="48" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><rect x="231.5" y="56.5" width="202" height="3" rx="1.5" fill="var(--sf-accent)" stroke="none" stroke-width="1.4"/><text x="332" y="85" text-anchor="middle" font-size="10.5" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">MOPAC-parity PM3</text><path d="M440,79 L510,79" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.3s" repeatCount="indefinite" path="M440,79 L510,79"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle><rect x="515" y="55" width="245" height="48" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="637" y="85" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">stationary density</text><rect x="35" y="117" width="118" height="48" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="94" y="147" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">xtb / gfn2</text><path d="M158,141 L225,141" fill="none" stroke="var(--sf-accent2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent2)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.15s" repeatCount="indefinite" path="M158,141 L225,141"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.15s" repeatCount="indefinite"/></circle><rect x="230" y="117" width="205" height="48" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><rect x="231.5" y="118.5" width="202" height="3" rx="1.5" fill="var(--sf-accent2)" stroke="none" stroke-width="1.4"/><text x="332" y="147" text-anchor="middle" font-size="10.5" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">GFN2-xTB</text><path d="M440,141 L510,141" fill="none" stroke="var(--sf-accent2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent2)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.44999999999999996s" repeatCount="indefinite" path="M440,141 L510,141"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.44999999999999996s" repeatCount="indefinite"/></circle><rect x="515" y="117" width="245" height="48" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="637" y="147" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">warm-started FD</text><rect x="35" y="179" width="118" height="48" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="94" y="209" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">gfn1</text><path d="M158,203 L225,203" fill="none" stroke="var(--sf-violet)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-violet)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.3s" repeatCount="indefinite" path="M158,203 L225,203"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle><rect x="230" y="179" width="205" height="48" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><rect x="231.5" y="180.5" width="202" height="3" rx="1.5" fill="var(--sf-violet)" stroke="none" stroke-width="1.4"/><text x="332" y="209" text-anchor="middle" font-size="10.5" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">GFN1-xTB</text><path d="M440,203 L510,203" fill="none" stroke="var(--sf-violet)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-violet)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.6s" repeatCount="indefinite" path="M440,203 L510,203"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.6s" repeatCount="indefinite"/></circle><rect x="515" y="179" width="245" height="48" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="637" y="209" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">finite differences</text><rect x="35" y="241" width="118" height="48" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="94" y="271" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">gfn0</text><path d="M158,265 L225,265" fill="none" stroke="var(--sf-warm)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-warm)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.44999999999999996s" repeatCount="indefinite" path="M158,265 L225,265"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.44999999999999996s" repeatCount="indefinite"/></circle><rect x="230" y="241" width="205" height="48" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><rect x="231.5" y="242.5" width="202" height="3" rx="1.5" fill="var(--sf-warm)" stroke="none" stroke-width="1.4"/><text x="332" y="271" text-anchor="middle" font-size="10.5" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">GFN0-xTB</text><path d="M440,265 L510,265" fill="none" stroke="var(--sf-warm)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-energy-surface-map-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-warm)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.75s" repeatCount="indefinite" path="M440,265 L510,265"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.75s" repeatCount="indefinite"/></circle><rect x="515" y="241" width="245" height="48" rx="10" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="637" y="271" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">finite differences</text><text x="94" y="34" text-anchor="middle" font-size="9.5" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">public name</text><text x="332" y="34" text-anchor="middle" font-size="9.5" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">energy surface</text><text x="637" y="34" text-anchor="middle" font-size="9.5" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">gradient path</text><rect x="300" y="312" width="190" height="22" rx="11.0" fill="var(--sf-soft)" stroke="var(--sf-accent2)" stroke-width="1"/><text x="395.0" y="326.5" text-anchor="middle" font-size="10" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">name == energy == gradient</text>
</svg>

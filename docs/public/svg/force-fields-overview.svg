ine)" stroke-width="1.3"/><text x="678" y="72" text-anchor="start" font-size="11.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">E_4D = Σ xᵢ₄²</text><text x="678" y="90" text-anchor="start" font-size="9.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">pull the 4th coordinate to 0</text><rect x="694" y="119.0" width="26" height="81.0" rx="3" fill="var(--sf-line)" stroke="none" stroke-width="1.4" opacity="0.8"/><rect x="736" y="146.0" width="26" height="54.0" rx="3" fill="var(--sf-line)" stroke="none" stroke-width="1.4" opacity="0.8"/><rect x="778" y="177.5" width="26" height="22.5" rx="3" fill="var(--sf-warm)" stroke="none" stroke-width="1.4" opacity="0.8"/><rect x="820" y="197.3" width="26" height="2.6999999999999997" rx="3" fill="var(--sf-accent2)" stroke="none" stroke-width="1.4" opacity="0.8"/><path d="M688,200 L860,200" fill="none" stroke="var(--sf-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="770" y="216" text-anchor="middle" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">|x₄| during minimization →</text><text x="770" y="246" text-anchor="middle" font-size="9.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">phase 1: w_chiral 1.0 · w_4D 0.1</text><text x="770" y="264" text-anchor="middle" font-size="9.5" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">phase 2: w_chiral 0.2 · w_4D 1.0</text><text x="770" y="290" text-anchor="middle" font-size="9" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">then keep first 3 columns</text>
</svg>

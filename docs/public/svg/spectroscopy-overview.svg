<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-label="One 3D geometry feeds three spectroscopy tracks: UV-Vis, infrared and nuclear magnetic resonance.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-spectroscopy-overview-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-spectroscopy-overview-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-spectroscopy-overview-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="780" height="330" fill="url(#sf-spectroscopy-overview-glow)" stroke="none"/>
<rect x="55" y="120" width="150" height="100" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><text x="130" y="160" text-anchor="middle" font-size="12" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">3D geometry</text><text x="130" y="180" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">elements + coords</text><path d="M210,170 Q243.94906895673142,120.79166008722612 300,100" fill="none" stroke="var(--sf-violet)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-spectroscopy-overview-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-violet)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.2s" repeatCount="indefinite" path="M210,170 Q243.94906895673142,120.79166008722612 300,100"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle><rect x="320" y="65" width="200" height="70" rx="12" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><rect x="321.5" y="66.5" width="197" height="4" rx="2" fill="var(--sf-violet)" stroke="none" stroke-width="1.4"/><text x="420" y="95" text-anchor="middle" font-size="12" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">UV-Vis</text><text x="420" y="115" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">electronic transitions</text><circle cx="500" cy="100" r="6" fill="var(--sf-violet)" class="sf-pulse"/><path d="M210,170 L300,190" fill="none" stroke="var(--sf-warm)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-spectroscopy-overview-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-warm)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.35s" repeatCount="indefinite" path="M210,170 L300,190"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.35s" repeatCount="indefinite"/></circle><rect x="320" y="155" width="200" height="70" rx="12" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><rect x="321.5" y="156.5" width="197" height="4" rx="2" fill="var(--sf-warm)" stroke="none" stroke-width="1.4"/><text x="420" y="185" text-anchor="middle" font-size="12" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">IR</text><text x="420" y="205" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">vibrational modes</text><circle cx="500" cy="190" r="6" fill="var(--sf-warm)" class="sf-pulse"/><path d="M210,170 Q241.06876861434023,236.39828022463072 300,280" fill="none" stroke="var(--sf-accent2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-spectroscopy-overview-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-accent2)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.5s" repeatCount="indefinite" path="M210,170 Q241.06876861434023,236.39828022463072 300,280"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.5s" repeatCount="indefinite"/></circle><rect x="320" y="245" width="200" height="70" rx="12" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.4"/><rect x="321.5" y="246.5" width="197" height="4" rx="2" fill="var(--sf-accent2)" stroke="none" stroke-width="1.4"/><text x="420" y="275" text-anchor="middle" font-size="12" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">NMR</text><text x="420" y="295" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">chemical shifts</text><circle cx="500" cy="280" r="6" fill="var(--sf-accent2)" class="sf-pulse"/><path d="M580,55 L580,105 M580,105 L730,105" fill="none" stroke="var(--sf-line)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M580,105 l4,-4 M580,105 l-4,-4" fill="none" stroke="var(--sf-line)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M580,55 l-4,4 M580,55 l4,4" fill="none" stroke="var(--sf-line)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M610,105 L610,79" fill="none" stroke="var(--sf-violet)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M640,105 L640,67" fill="none" stroke="var(--sf-violet)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M670,105 L670,85" fill="none" stroke="var(--sf-violet)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M580,145 L580,195 M580,195 L730,195" fill="none" stroke="var(--sf-line)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M580,195 l4,-4 M580,195 l-4,-4" fill="none" stroke="var(--sf-line)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M580,145 l-4,4 M580,145 l4,4" fill="none" stroke="var(--sf-line)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,195 L600,177" fill="none" stroke="var(--sf-warm)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M624,195 L624,165" fill="none" stroke="var(--sf-warm)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M648,195 L648,171" fill="none" stroke="var(--sf-warm)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M672,195 L672,183" fill="none" stroke="var(--sf-warm)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M580,235 L580,285 M580,285 L730,285" fill="none" stroke="var(--sf-line)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M580,285 l4,-4 M580,285 l-4,-4" fill="none" stroke="var(--sf-line)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M580,235 l-4,4 M580,235 l4,4" fill="none" stroke="var(--sf-line)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,285 L600,271" fill="none" stroke="var(--sf-accent2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M624,285 L624,259" fill="none" stroke="var(--sf-accent2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M648,285 L648,265" fill="none" stroke="var(--sf-accent2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M672,285 L672,253" fill="none" stroke="var(--sf-accent2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

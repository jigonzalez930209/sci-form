<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Real power-iteration traces on butane's metric matrix: three deflated runs converge to 5.25, 1.45 and 0.26, which scale the eigenvectors into 3D coordinates.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-embedding-eigendecomp-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-embedding-eigendecomp-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-embedding-eigendecomp-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="900" height="380" fill="url(#sf-embedding-eigendecomp-glow)" stroke="none"/>
<defs><radialGradient id="sf-embedding-eigendecomp-C" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#1e293b"/></radialGradient><radialGradient id="sf-embedding-eigendecomp-O" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fda4af"/><stop offset="100%" stop-color="#be123c"/></radialGradient><radialGradient id="sf-embedding-eigendecomp-N" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#1d4ed8"/></radialGradient><radialGradient id="sf-embedding-eigendecomp-H" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cbd5e1"/></radialGradient><radialGradient id="sf-embedding-eigendecomp-S" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#b45309"/></radialGradient><marker id="sf-embedding-eigendecomp-arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-rose)"/></marker></defs><text x="450" y="32" text-anchor="middle" font-size="15" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">Power iteration with deflation on butane's metric matrix T</text><rect x="24" y="56" width="540" height="284" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><path d="M70,76 L70,296 M70,296 L540,296" fill="none" stroke="var(--sf-line)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M70,296 l4,-4 M70,296 l-4,-4" fill="none" stroke="var(--sf-line)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M70,76 l-4,4 M70,76 l4,4" fill="none" stroke="var(--sf-line)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><text x="305.0" y="318" text-anchor="middle" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">iteration</text><text x="52" y="186.0" text-anchor="middle" font-size="10" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)" transform="rotate(-90 52 186.0)">Rayleigh quotient vᵀTv</text><path d="M70,103.5 L540,103.5" fill="none" stroke="var(--sf-violet)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4" opacity="0.7"/><path d="M80.00,275.30 L120.91,140.95 L161.82,107.17 L202.73,103.79 L243.64,103.53 L284.55,103.51 L325.45,103.51 L366.36,103.51 L407.27,103.51 L448.18,103.51 L489.09,103.51 L530.00,103.51" fill="none" stroke="var(--sf-violet)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80.0" cy="275.2996699669967" r="2.6" fill="var(--sf-violet)"/><circle cx="120.9090909090909" cy="140.94965934347528" r="2.6" fill="var(--sf-violet)"/><circle cx="161.8181818181818" cy="107.17431423058883" r="2.6" fill="var(--sf-violet)"/><circle cx="202.72727272727275" cy="103.79499659565494" r="2.6" fill="var(--sf-violet)"/><circle cx="243.63636363636363" cy="103.52880722505026" r="2.6" fill="var(--sf-violet)"/><circle cx="284.5454545454545" cy="103.50831853346185" r="2.6" fill="var(--sf-violet)"/><circle cx="325.4545454545455" cy="103.50674444219771" r="2.6" fill="var(--sf-violet)"/><circle cx="366.3636363636364" cy="103.50662352651779" r="2.6" fill="var(--sf-violet)"/><circle cx="407.27272727272725" cy="103.50661423834106" r="2.6" fill="var(--sf-violet)"/><circle cx="448.1818181818182" cy="103.50661352486736" r="2.6" fill="var(--sf-violet)"/><circle cx="489.09090909090907" cy="103.50661347006167" r="2.6" fill="var(--sf-violet)"/><circle cx="530.0" cy="103.50661346585179" r="2.6" fill="var(--sf-violet)"/><text x="536" y="97.5066134655284" text-anchor="end" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-violet)">λ1 = 5.250</text><path d="M70,242.6 L540,242.6" fill="none" stroke="var(--sf-accent2)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4" opacity="0.7"/><path d="M80.00,289.25 L120.91,242.99 L161.82,242.66 L202.73,242.65 L243.64,242.65 L284.55,242.65 L325.45,242.65 L366.36,242.65 L407.27,242.65 L448.18,242.65 L489.09,242.65 L530.00,242.65" fill="none" stroke="var(--sf-accent2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80.0" cy="289.2475318114508" r="2.6" fill="var(--sf-accent2)"/><circle cx="120.9090909090909" cy="242.99382223230435" r="2.6" fill="var(--sf-accent2)"/><circle cx="161.8181818181818" cy="242.66037861378095" r="2.6" fill="var(--sf-accent2)"/><circle cx="202.72727272727275" cy="242.64972417132432" r="2.6" fill="var(--sf-accent2)"/><circle cx="243.63636363636363" cy="242.64938340930541" r="2.6" fill="var(--sf-accent2)"/><circle cx="284.5454545454545" cy="242.64937251329513" r="2.6" fill="var(--sf-accent2)"/><circle cx="325.4545454545455" cy="242.6493721648933" r="2.6" fill="var(--sf-accent2)"/><circle cx="366.3636363636364" cy="242.6493721537531" r="2.6" fill="var(--sf-accent2)"/><circle cx="407.27272727272725" cy="242.64937215339688" r="2.6" fill="var(--sf-accent2)"/><circle cx="448.1818181818182" cy="242.64937215338549" r="2.6" fill="var(--sf-accent2)"/><circle cx="489.09090909090907" cy="242.64937215338512" r="2.6" fill="var(--sf-accent2)"/><circle cx="530.0" cy="242.64937215338512" r="2.6" fill="var(--sf-accent2)"/><text x="536" y="236.64937215338512" text-anchor="end" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">λ2 = 1.455</text><path d="M70,286.5 L540,286.5" fill="none" stroke="var(--sf-warm)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4" opacity="0.7"/><path d="M80.00,295.69 L120.91,286.51 L161.82,286.46 L202.73,286.46 L243.64,286.46 L284.55,286.46 L325.45,286.46 L366.36,286.46 L407.27,286.46 L448.18,286.46 L489.09,286.46 L530.00,286.46" fill="none" stroke="var(--sf-warm)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80.0" cy="295.68934224558035" r="2.6" fill="var(--sf-warm)"/><circle cx="120.9090909090909" cy="286.5061921442373" r="2.6" fill="var(--sf-warm)"/><circle cx="161.8181818181818" cy="286.4600704394053" r="2.6" fill="var(--sf-warm)"/><circle cx="202.72727272727275" cy="286.46005320757513" r="2.6" fill="var(--sf-warm)"/><circle cx="243.63636363636363" cy="286.46005320116757" r="2.6" fill="var(--sf-warm)"/><circle cx="284.5454545454545" cy="286.4600532011652" r="2.6" fill="var(--sf-warm)"/><circle cx="325.4545454545455" cy="286.4600532011652" r="2.6" fill="var(--sf-warm)"/><circle cx="366.3636363636364" cy="286.4600532011652" r="2.6" fill="var(--sf-warm)"/><circle cx="407.27272727272725" cy="286.4600532011652" r="2.6" fill="var(--sf-warm)"/><circle cx="448.1818181818182" cy="286.4600532011652" r="2.6" fill="var(--sf-warm)"/><circle cx="489.09090909090907" cy="286.4600532011652" r="2.6" fill="var(--sf-warm)"/><circle cx="530.0" cy="286.4600532011652" r="2.6" fill="var(--sf-warm)"/><text x="536" y="280.4600532011652" text-anchor="end" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">λ3 = 0.260</text><text x="62" y="299.0" text-anchor="end" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">0</text><text x="62" y="225.66666666666669" text-anchor="end" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">2</text><text x="62" y="152.33333333333334" text-anchor="end" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">4</text><text x="62" y="79.0" text-anchor="end" font-size="8.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">6</text><rect x="600" y="56" width="276" height="150" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><text x="616" y="80" text-anchor="start" font-size="10.5" font-weight="700" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">for k = 1, 2, 3:</text><text x="624" y="102" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">v ← random unit (Mt19937)</text><text x="624" y="122" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">repeat ≤ 200:</text><text x="624" y="142" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">  w = T v,  λ = v·w</text><text x="624" y="162" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-ink)">  v = w / ‖w‖  (tol 10⁻⁶)</text><text x="624" y="182" text-anchor="start" font-size="10" font-weight="500" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' fill="var(--sf-rose)">T ← T − λ v vᵀ   (deflate)</text><rect x="600" y="218" width="276" height="98" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><text x="616" y="240" text-anchor="start" font-size="10" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">xᵢₖ = √λₖ · vᵢₖ   (check λₖ &gt; 10⁻³)</text><g class="sf-float"><path d="M699.8,297.6 L720.3,266.4 L755.7,266.4 L776.2,297.6" fill="none" stroke="var(--sf-ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="699.78" cy="297.6" r="8.55" fill="url(#sf-embedding-eigendecomp-C)"/><text x="699.78" y="300.678" text-anchor="middle" font-size="8" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">C</text><text x="699.78" y="319.6" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">C1</text><circle cx="720.32" cy="266.4" r="9.96" fill="url(#sf-embedding-eigendecomp-C)"/><text x="720.32" y="269.9856" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">C</text><text x="720.32" y="251.39999999999998" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">C2</text><circle cx="755.68" cy="266.4" r="8.04" fill="url(#sf-embedding-eigendecomp-C)"/><text x="755.68" y="269.2944" text-anchor="middle" font-size="8" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">C</text><text x="755.68" y="251.39999999999998" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">C3</text><circle cx="776.22" cy="297.6" r="9.45" fill="url(#sf-embedding-eigendecomp-C)"/><text x="776.22" y="301.002" text-anchor="middle" font-size="8" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">C</text><text x="776.22" y="319.6" text-anchor="middle" font-size="9" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">C4</text></g><text x="450" y="366" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">Each deflation removes the found direction, so the next run converges to the next-largest eigenvalue; λ₄ = 0 is never needed.</text>
</svg>

<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 260" width="650" height="260" role="img" aria-label="A tetrahedral centre with large volume is accepted; a nearly coplanar centre is rejected.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-validation-tetrahedral-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-validation-tetrahedral-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-validation-tetrahedral-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="650" height="260" fill="url(#sf-validation-tetrahedral-glow)" stroke="none"/>
<path d="M100,190 L190,190 L145,115 Z" fill="none" stroke="var(--sf-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M145,115 L155,70 L100,190" fill="none" stroke="var(--sf-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M155,70 L190,190" fill="none" stroke="var(--sf-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="100" cy="190" r="7" fill="var(--sf-accent2)" opacity="0.85"/><circle cx="190" cy="190" r="7" fill="var(--sf-accent2)" opacity="0.85"/><circle cx="145" cy="115" r="7" fill="var(--sf-accent2)" opacity="0.85"/><circle cx="155" cy="70" r="7" fill="var(--sf-accent2)" opacity="0.85"/><circle cx="145" cy="142" r="8" fill="var(--sf-accent)"/><text x="145" y="230" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">volume large</text><text x="145" y="48" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">accept</text><path d="M470,190 L560,190 L515,178 Z" fill="none" stroke="var(--sf-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M515,178 L525,174 L470,190" fill="none" stroke="var(--sf-line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="470" cy="190" r="7" fill="var(--sf-rose)" opacity="0.75"/><circle cx="560" cy="190" r="7" fill="var(--sf-rose)" opacity="0.75"/><circle cx="515" cy="178" r="7" fill="var(--sf-rose)" opacity="0.75"/><circle cx="525" cy="174" r="7" fill="var(--sf-rose)" opacity="0.75"/><circle cx="515" cy="183" r="8" fill="var(--sf-warm)"/><text x="515" y="230" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">volume near zero</text><text x="515" y="48" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">reject</text><path d="M250,130 L400,130" fill="none" stroke="var(--sf-line)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-validation-tetrahedral-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-line)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.3s" repeatCount="indefinite" path="M250,130 L400,130"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle><text x="325" y="115" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">collapse</text>
</svg>

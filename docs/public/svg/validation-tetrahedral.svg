.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M344,196 L379.1,213.2" fill="none" stroke="var(--sf-ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M344,196 L369.5,177.9" fill="none" stroke="var(--sf-ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M344,196 L344.0,134.0" fill="none" stroke="var(--sf-ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="283.43391004532117" cy="206.65649502741283" r="8" fill="url(#sf-validation-tetrahedral-C)"/><circle cx="379.1086285636646" cy="213.17420449494034" r="8" fill="url(#sf-validation-tetrahedral-C)"/><circle cx="369.45746139101425" cy="177.90378833883437" r="8" fill="url(#sf-validation-tetrahedral-C)"/><circle cx="344.0" cy="134.0" r="8" fill="url(#sf-validation-tetrahedral-C)"/><circle cx="344" cy="196" r="11" fill="url(#sf-validation-tetrahedral-C)"/><text x="344" y="199.96" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">C</text><text x="344" y="300" text-anchor="middle" font-size="12" font-weight="800" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">min |Vₖ| = 0.136</text><text x="344" y="322" text-anchor="middle" font-size="10" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">reject (&lt; 0.50)</text><rect x="464" y="50" width="412" height="300" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><text x="478" y="72" text-anchor="start" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">min |V̂_AC · (V̂_BC × V̂_DC)| over the 4 triples</text><path d="M514,90 L514,290 L844,290" fill="none" stroke="var(--sf-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect 
ll="var(--sf-violet)" stroke="none" stroke-width="1.4"/><text x="470.25" y="82" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">3</text><text x="486.5" y="82" text-anchor="start" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">Chiral sign</text><path d="M650,172.0 L663,172.0" fill="none" stroke="var(--sf-violet)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-validation-pipeline-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-violet)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.4s" repeatCount="indefinite" path="M650,172.0 L663,172.0"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.4s" repeatCount="indefinite"/></circle><rect x="666" y="54" width="196" height="236" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><rect x="667.5" y="55.5" width="193" height="4" rx="2" fill="var(--sf-warm)" stroke="none" stroke-width="1.4"/><rect x="676" y="68" width="16.5" height="20" rx="6" fill="var(--sf-warm)" stroke="none" stroke-width="1.4"/><text x="684.25" y="82" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">4</text><text x="700.5" y="82" text-anchor="start" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">Planarity</text><path d="M864,172.0 L877,172.0" fill="none" stroke="var(--sf-warm)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-validation-pipeline-arrow)" class="sf-flow"/><circle r="2.6" fill="var(--sf-warm)" class="sf-particle" opacity="0"><animateMotion dur="2.8s" begin="0.6000000000000001s" repeatCount="indefinite" path="M864,172.0 L877,172.0"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.6000000000000001s" repeatCount="indefinite"/></circle><rect x="880" y="54" width="196" height="236" rx="14" fill="var(--sf-card)" stroke="var(--sf-line)" stroke-width="1.3"/><rect x="881.5" y="55.5" width="193" height="4" rx="2" fill="var(--sf-rose)" stroke="none" stroke-width="1.4"/><rect x="890" y="68" width="16.5" height="20" rx="6" fill="var(--sf-rose)" stroke="none" stroke-width="1.4"/><text x="898.25" y="82" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="#fff">5</text><text x="914.5" y="82" text-anchor="start" font-size="11" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">Double bond</text><rect x="36" y="106" width="172" height="34" rx="8" fill="var(--sf-soft)" stroke="var(--sf-accent)" stroke-width="1.1"/><text x="122.0" y="128" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">E_total / N &lt; 0.05</text><text x="122.0" y="162" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">bounds-FF energy after BFGS</text><text x="122.0" y="182" text-anchor="middle" font-size="9.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">catches: bad embedding</text><circle cx="90" cy="230" r="13" fill="var(--sf-accent2)"/><path d="M84,230 l4,4 l8,-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="258" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">pass</text><circle cx="154" cy="230" r="13" fill="var(--sf-rose)"/><path d="M149,225 l10,10 M159,225 l-10,10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="154" y="258" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">retry</text><path d="M154,243 L154,308" fill="none" stroke="var(--sf-rose)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="250" y="106" width="172" height="34" rx="8" fill="var(--sf-soft)" stroke="var(--sf-accent2)" stroke-width="1.1"/><text x="336.0" y="128" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">min |Vₖ| &gt; 0.50</text><text x="336.0" y="162" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">(0.25 in small rings)</text><text x="336.0" y="182" text-anchor="middle" font-size="9.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">C/N, degree 4, ≥ 2 rings</text><circle cx="304" cy="230" r="13" fill="var(--sf-accent2)"/><path d="M298,230 l4,4 l8,-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="304" y="258" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">pass</text><circle cx="368" cy="230" r="13" fill="var(--sf-rose)"/><path d="M363,225 l10,10 M373,225 l-10,10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="368" y="258" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">retry</text><path d="M368,243 L368,308" fill="none" stroke="var(--sf-rose)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="464" y="106" width="172" height="34" rx="8" fill="var(--sf-soft)" stroke="var(--sf-violet)" stroke-width="1.1"/><text x="550.0" y="128" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">sign V = sign V_target</text><text x="550.0" y="162" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">|V| &gt; 0.2 |V_target|</text><text x="550.0" y="182" text-anchor="middle" font-size="9.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">@ → V &gt; 0 · @@ → V &lt; 0</text><circle cx="518" cy="230" r="13" fill="var(--sf-accent2)"/><path d="M512,230 l4,4 l8,-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="518" y="258" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">pass</text><circle cx="582" cy="230" r="13" fill="var(--sf-rose)"/><path d="M577,225 l10,10 M587,225 l-10,10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="582" y="258" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">retry</text><path d="M582,243 L582,308" fill="none" stroke="var(--sf-rose)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="678" y="106" width="172" height="34" rx="8" fill="var(--sf-soft)" stroke="var(--sf-warm)" stroke-width="1.1"/><text x="764.0" y="128" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">E_oop &lt; 0.7 · N_improper</text><text x="764.0" y="162" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">sp: angle &gt; 175°</text><text x="764.0" y="182" text-anchor="middle" font-size="9.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">catches: puckered sp²</text><circle cx="732" cy="230" r="13" fill="var(--sf-accent2)"/><path d="M726,230 l4,4 l8,-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="732" y="258" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">pass</text><circle cx="796" cy="230" r="13" fill="var(--sf-rose)"/><path d="M791,225 l10,10 M801,225 l-10,10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="796" y="258" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">retry</text><path d="M796,243 L796,308" fill="none" stroke="var(--sf-rose)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="892" y="106" width="172" height="34" rx="8" fill="var(--sf-soft)" stroke="var(--sf-rose)" stroke-width="1.1"/><text x="978.0" y="128" text-anchor="middle" font-size="10.5" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">cos θ + 1 &gt; 10⁻³</text><text x="978.0" y="162" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-ink)">θ: substituent vs C=C</text><text x="978.0" y="182" text-anchor="middle" font-size="9.5" font-weight="450" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">catches: linear substituent</text><circle cx="946" cy="230" r="13" fill="var(--sf-accent2)"/><path d="M940,230 l4,4 l8,-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="946" y="258" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-accent2)">pass</text><circle cx="1010" cy="230" r="13" fill="var(--sf-rose)"/><path d="M1005,225 l10,10 M1015,225 l-10,10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1010" y="258" text-anchor="middle" font-size="9" font-weight="700" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">retry</text><path d="M1010,243 L1010,308" fill="none" stroke="var(--sf-rose)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M1010,308 L40,308 L40,172.0 L23,172.0" fill="none" stroke="var(--sf-rose)" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sf-validation-pipeline-arrow-rose)" class="sf-flow"/><text x="550" y="330" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-rose)">retry budget 10N attempts (30 atoms → 300) · most molecules pass in 1–5, strained / many stereocentres 10–50</text>

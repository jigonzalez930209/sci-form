ont-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">DG start φ = 95°</text><circle r="4" fill="var(--sf-warm)" class="sf-particle" opacity="0"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M645.3,210.1 L645.3,210.1 L635.0,230.7 L624.7,251.2 L614.4,270.3 L604.2,286.8 L593.9,299.4 L583.6,307.3 L573.3,310.0"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle><path d="M645.3,210.1 L645.3,210.1 L635.0,230.7 L624.7,251.2 L614.4,270.3 L604.2,286.8 L593.9,299.4 L583.6,307.3 L573.3,310.0" fill="none" stroke="var(--sf-warm)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4" class="sf-flow"/><text x="450" y="352" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">BFGS slides each dihedral into its nearest well. With V₃ alone, anti and gauche wells are equally deep (0 kcal/mol);</text><text x="450" y="367" text-anchor="middle" font-size="9.5" font-weight="500" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">eclipsed geometries (0°, ±120°) cost 14 kcal/mol and are effectively forbidden.</text>

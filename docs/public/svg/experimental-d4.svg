<svg class="sf-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" width="780" height="280" role="img" aria-label="Two molecular fragments exchange dynamic dispersion interactions.">
<style>
.sf-d{
  --sf-ink:#0f172a; --sf-muted:#5b6b82; --sf-line:#9aa9bd;
  --sf-card:rgba(255,255,255,.62); --sf-card2:rgba(255,255,255,.34);
  --sf-accent:#2563eb; --sf-accent2:#0d9488; --sf-warm:#d97706;
  --sf-violet:#7c3aed; --sf-rose:#e11d48;
  --sf-soft:rgba(37,99,235,.12); --sf-glow:rgba(37,99,235,.20);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark .sf-d{
  --sf-ink:#e6edf7; --sf-muted:#9fb0c7; --sf-line:#5b6b82;
  --sf-card:rgba(15,23,42,.52); --sf-card2:rgba(15,23,42,.28);
  --sf-accent:#60a5fa; --sf-accent2:#2dd4bf; --sf-warm:#fbbf24;
  --sf-violet:#a78bfa; --sf-rose:#fb7185;
  --sf-soft:rgba(96,165,250,.14); --sf-glow:rgba(96,165,250,.20);
}
@keyframes sf-dash{to{stroke-dashoffset:-28}}
@keyframes sf-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sf-halo{0%,100%{transform:scale(.92);opacity:.14}50%{transform:scale(1.08);opacity:.34}}
@keyframes sf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sf-draw{to{stroke-dashoffset:0}}
@keyframes sf-spin{to{transform:rotate(360deg)}}
@keyframes sf-blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sf-rise{0%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes sf-scan{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--sf-span,260px));opacity:0}}
.sf-flow{stroke-dasharray:4 6;animation:sf-dash 1.3s linear infinite}
.sf-pulse{transform-box:fill-box;transform-origin:center;animation:sf-pulse 2.8s ease-in-out infinite}
.sf-halo{transform-box:fill-box;transform-origin:center;animation:sf-halo 3.4s ease-in-out infinite}
.sf-float{transform-box:fill-box;transform-origin:center;animation:sf-float 4.5s ease-in-out infinite}
.sf-spin{transform-box:fill-box;transform-origin:center;animation:sf-spin 12s linear infinite}
.sf-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:sf-draw 2s ease forwards}
.sf-blink{animation:sf-blink 2.4s ease-in-out infinite}
.sf-rise{animation:sf-rise .9s ease both}
.sf-d1{animation-delay:.25s}.sf-d2{animation-delay:.5s}.sf-d3{animation-delay:.75s}
.sf-d4{animation-delay:1s}.sf-d5{animation-delay:1.25s}.sf-d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){
  .sf-flow,.sf-pulse,.sf-halo,.sf-float,.sf-spin,.sf-draw,.sf-blink,.sf-rise{animation:none!important}
  .sf-draw{stroke-dashoffset:0!important}
  .sf-particle{display:none}
}
</style>
<defs>
  <marker id="sf-experimental-d4-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 Z" fill="var(--sf-line)"/>
  </marker>
  <radialGradient id="sf-experimental-d4-glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="var(--sf-accent)" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="var(--sf-accent)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-experimental-d4-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="var(--sf-accent)"/>
    <stop offset="100%" stop-color="var(--sf-accent2)"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="780" height="280" fill="url(#sf-experimental-d4-glow)" stroke="none"/>
<g class="sf-float"><path d="M195.57,120.39 L227.09,145.02 L221.52,184.63 L184.43,199.61 L152.91,174.98 L158.48,135.37 Z" fill="none" stroke="var(--sf-line)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="190" cy="160" r="22.400000000000002" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" opacity="0.75"/><circle cx="195.56692403840262" cy="120.38927725033719" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="227.0873541826715" cy="145.01573626336352" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="221.5204301442689" cy="184.62645901302633" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="184.43307596159738" cy="199.6107227496628" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="152.9126458173285" cy="174.98426373663648" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="158.4795698557311" cy="135.37354098697367" r="4.5" fill="var(--sf-ink)" opacity="0.85"/></g><g class="sf-float sf-d2"><path d="M551.77,107.01 L584.46,116.38 L592.68,149.37 L568.23,172.99 L535.54,163.62 L527.32,130.63 Z" fill="none" stroke="var(--sf-line)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="140" r="19.040000000000003" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" opacity="0.75"/><circle cx="551.7746555496113" cy="107.00994530661612" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="584.4575532115141" cy="116.3816154043941" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="592.6828976619029" cy="149.37167009777798" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="568.2253444503887" cy="172.99005469338388" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="535.5424467884859" cy="163.6183845956059" r="4.5" fill="var(--sf-ink)" opacity="0.85"/><circle cx="527.3171023380971" cy="130.62832990222205" r="4.5" fill="var(--sf-ink)" opacity="0.85"/></g><text x="190" y="228" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">fragment A</text><text x="560" y="208" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">fragment B</text><path d="M255,110 C330,92 420,128 500,110" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="sf-flow sf-d1" opacity="0.65"/><path d="M255,128 C330,110 420,146 500,128" fill="none" stroke="var(--sf-accent2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="sf-flow sf-d2" opacity="0.65"/><path d="M255,146 C330,128 420,164 500,146" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="sf-flow sf-d3" opacity="0.65"/><path d="M255,164 C330,146 420,182 500,164" fill="none" stroke="var(--sf-accent2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="sf-flow sf-d4" opacity="0.65"/><path d="M255,182 C330,164 420,200 500,182" fill="none" stroke="var(--sf-accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="sf-flow sf-d5" opacity="0.65"/><text x="378" y="244" text-anchor="middle" font-size="10" font-weight="600" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-muted)">dynamic C6 / C8</text><rect x="338" y="42" width="82" height="22" rx="11.0" fill="var(--sf-soft)" stroke="var(--sf-warm)" stroke-width="1"/><text x="379.0" y="56.5" text-anchor="middle" font-size="10" font-weight="650" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' fill="var(--sf-warm)">dispersion</text>
</svg>

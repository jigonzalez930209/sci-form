name: Release

on:
  push:
    tags: ["v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The feature lists MUST be identical to the ones in ci.yml: the published
  # artefacts are what the maintainer tested locally and CI built, so a
  # shorter list here would ship a wheel and an npm package with fewer
  # capabilities than the documentation promises. `scripts/check_feature_parity.py` fails the build if the two
  # workflows ever drift apart.
  PYTHON_BINDING_FEATURES: >-
    parallel
    alpha-dft alpha-reaxff alpha-mlff alpha-obara-saika alpha-cga alpha-gsm alpha-sdr
    alpha-dynamics-live alpha-imd alpha-edl alpha-periodic-linear alpha-kinetics
    alpha-render-bridge
    beta-kpm beta-mbh beta-randnla beta-riemannian beta-cpm
  WASM_WEB_FEATURES: >-
    parallel experimental-gpu
    alpha-dft alpha-reaxff alpha-mlff alpha-obara-saika alpha-cga alpha-gsm alpha-sdr
    alpha-dynamics-live alpha-imd alpha-edl alpha-periodic-linear alpha-kinetics
    alpha-render-bridge
    beta-kpm beta-mbh beta-randnla beta-riemannian beta-cpm
  # The Node.js build has no rayon threads (wasm-bindgen-rayon needs the
  # browser Worker API) and no WebGPU (Node.js has no WebGPU): both features
  # change behaviour, not the export list, so the API is the same.
  WASM_NODE_FEATURES: >-
    alpha-dft alpha-reaxff alpha-mlff alpha-obara-saika alpha-cga alpha-gsm alpha-sdr
    alpha-dynamics-live alpha-imd alpha-edl alpha-periodic-linear alpha-kinetics
    alpha-render-bridge
    beta-kpm beta-mbh beta-randnla beta-riemannian beta-cpm

# ─────────────────────────────────────────────────────────────────────────────
# Release pipeline (runs on a pushed tag `vX.Y.Z`).
#
# The tests are NOT run here: `scripts/release-check.sh` runs all of them on the
# maintainer's machine and `scripts/release.sh` only creates the tag when they
# pass. GitHub only BUILDS and PUBLISHES, with cached cargo registries/targets:
#
#   0. check-version   the tag must match every manifest
#   1. build-cli       Linux x86_64/aarch64, macOS x86_64/arm64, Windows
#                      → .tar.gz / .zip, plus .deb and .rpm on Linux
#   2. build-python    wheels (3 platforms) + sdist
#   3. build-wasm      npm package (web + node) and the single-threaded docs build
#   4. publish-*       crates.io, PyPI, npm
#   5. github-release  assets + SHA256SUMS
#   6. docs            the documentation site, deployed AFTER the builds so its
#                      live examples run on the package that was just compiled
# ─────────────────────────────────────────────────────────────────────────────

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─── Gate 0: the tag must match the version of every published crate ──────
  # Without this, `git tag v1.0.0` on a 0.15.2 tree publishes 0.15.2
  # artefacts under a "v1.0.0" release, and the crates.io/PyPI/npm versions
  # silently stay behind the tag.
  check-version:
    name: Check tag matches the crate versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare the release tag with every published version
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME#v}"
          echo "Release tag: ${GITHUB_REF_NAME} -> version ${tag}"
          status=0

          check_toml() {
            manifest="$1"; expected="$2"
            name=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$manifest" | head -1)
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -1)
            if [ "$name" != "$expected" ]; then
              echo "::error file=${manifest}::expected package '${expected}', found '${name}'"
              status=1
              return
            fi
            if [ "$version" != "$tag" ]; then
              echo "::error file=${manifest}::${name} is ${version} but the release tag is ${tag}"
              status=1
              return
            fi
            echo "OK  ${name} ${version}  (${manifest})"
          }

          # The four published Rust packages.
          check_toml Cargo.toml sci-form
          check_toml crates/cli/Cargo.toml sci-form-cli
          check_toml crates/python/Cargo.toml sci-form-python
          check_toml crates/wasm/Cargo.toml sci-form-wasm

          # The Python distribution (PyPI) and the npm package carry their own
          # version strings and must not drift from the tag either.
          py_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/python/pyproject.toml | head -1)
          if [ "$py_version" != "$tag" ]; then
            echo "::error file=crates/python/pyproject.toml::sciforma is ${py_version} but the release tag is ${tag}"
            status=1
          else
            echo "OK  sciforma ${py_version}  (crates/python/pyproject.toml)"
          fi

          npm_version=$(node -p "require('./package.json').version" 2>/dev/null || echo "")
          if [ "$npm_version" != "$tag" ]; then
            echo "::error file=package.json::the npm package is ${npm_version:-<unknown>} but the release tag is ${tag}"
            status=1
          else
            echo "OK  npm ${npm_version}  (package.json)"
          fi

          if [ "$status" -ne 0 ]; then
            echo "::error::the release tag does not match the crate versions — bump the crates or retag"
          fi
          exit "$status"

  # ─── Command-line tool: every platform, every package format ──────────────
  build-cli:
    name: CLI (${{ matrix.target }})
    needs: [check-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-${{ matrix.target }}
      - name: Install the aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install the .deb / .rpm builders
        if: contains(matrix.target, 'linux')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Build
        shell: bash
        run: cargo build --release -p sci-form-cli --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Smoke test (native targets only)
        if: matrix.target != 'aarch64-unknown-linux-gnu' && matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          exe=target/${{ matrix.target }}/release/sci-form
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" | head -5
      # A cross-compiled binary cannot print the shell completions; the host
      # build can (the command set is the same on every target).
      - name: Build the host binary for the completions
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo build --release -p sci-form-cli
      - name: Package (.tar.gz / .zip, .deb, .rpm, SHA256SUMS)
        shell: bash
        run: bash scripts/package-cli.sh ${{ matrix.target }} dist
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/*
            !dist/SHA256SUMS

  # ─── Python wheels ─────────────────────────────────────────────────────────
  build-python:
    name: Python (${{ matrix.os }})
    needs: [check-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-${{ matrix.os }}
      - run: pip install maturin
      - name: Build the wheel
        run: cd crates/python && maturin build --release --features "${PYTHON_BINDING_FEATURES}"
      - name: Build the sdist
        if: matrix.os == 'ubuntu-latest'
        run: cd crates/python && maturin sdist --out ../../target/wheels
      - uses: actions/upload-artifact@v6
        with:
          name: python-${{ matrix.os }}
          path: |
            target/wheels/*.whl
            target/wheels/*.tar.gz

  # ─── WASM / npm, and the docs build of the same code ───────────────────────
  build-wasm:
    name: WASM / npm
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The channel matches crates/wasm/rust-toolchain.toml (wasm-bindgen-rayon
      # needs the nightly-only `atomics` target feature).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-24
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          workspaces: crates/wasm
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the npm package (web + node)
        run: cd crates/wasm && bash build.sh --web-features "${WASM_WEB_FEATURES}" --node-features "${WASM_NODE_FEATURES}"
      - name: Build the single-threaded package for the documentation site
        run: cd crates/wasm && bash build.sh --docs-only --node-features "${WASM_NODE_FEATURES}"
      - uses: actions/upload-artifact@v6
        with:
          name: wasm-pkg
          path: crates/wasm/pkg/
      - uses: actions/upload-artifact@v6
        with:
          name: wasm-docs
          path: crates/wasm/pkg-docs/

  # ─── Publish ───────────────────────────────────────────────────────────────
  publish-crate:
    name: Publish to crates.io
    needs: [build-cli, build-python, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish
      - name: Publish sci-form (library)
        run: cargo publish --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for crates.io propagation
        run: sleep 45
      - name: Publish sci-form-cli
        run: cd crates/cli && cargo publish --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-python:
    name: Publish to PyPI
    needs: [build-cli, build-python, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true

  # NPM_TOKEN must be a Granular Access Token of type Automation (classic
  # tokens ask for an OTP even in CI): npmjs.com → Access Tokens → Generate New
  # Token → Granular → Packages: sci-form-wasm (Read+Write) → Automation.
  publish-npm:
    name: Publish to npm
    needs: [build-cli, build-python, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: pkg/
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: cd pkg && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── GitHub Release: CLI packages + wheels + checksums ─────────────────────
  github-release:
    name: GitHub Release
    needs: [publish-crate, publish-python, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Collect the assets and compute the checksums
        run: |
          mkdir release
          cp artifacts/cli-*/* release/
          cp artifacts/python-*/* release/
          cd release && sha256sum * > SHA256SUMS && ls -l
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Install

            **Command line** (Linux, macOS, Windows) — download below, or:

            | Platform | Package |
            |---|---|
            | Debian / Ubuntu | `sudo apt install ./sci-form_*_amd64.deb` (or `arm64`) |
            | Fedora / RHEL | `sudo dnf install ./sci-form-*.x86_64.rpm` (or `aarch64`) |
            | Linux (any) | `sci-form-*-<arch>-unknown-linux-gnu.tar.gz` |
            | macOS | `sci-form-*-aarch64-apple-darwin.tar.gz` (Apple Silicon) or `x86_64-apple-darwin` |
            | Windows | `sci-form-*-x86_64-pc-windows-msvc.zip` |

            Then run `sci-form` for a short guide, `sci-form commands` for every command, and
            `sci-form examples pm3 --run` for a ready-to-run example.

            ```bash
            pip install sciforma          # Python
            npm install sci-form-wasm     # JavaScript / TypeScript
            cargo add sci-form            # Rust
            cargo install sci-form-cli    # CLI from source
            ```

            Documentation with live examples: https://jigonzalez930209.github.io/sci-form/guide/live-examples

  # ─── Documentation: deployed after the builds, on the compiled package ─────
  docs:
    name: Documentation site
    needs: [publish-crate, publish-python, publish-npm]
    uses: ./.github/workflows/docs.yml
    with:
      use_artifact: true
    permissions:
      contents: read
      pages: write
      id-token: write

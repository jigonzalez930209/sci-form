name: Deploy Documentation

# The site has live examples that run the COMPILED WebAssembly package in the
# visitor's browser. A release calls this workflow after its builds with
# `use_artifact: true` and the package that was just built is reused; a manual
# run (workflow_dispatch) builds it first.

on:
  workflow_call:
    inputs:
      use_artifact:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Release run: take the package the build-wasm job produced.
      - name: Download the compiled WASM package
        if: ${{ inputs.use_artifact }}
        uses: actions/download-artifact@v8
        with:
          name: wasm-docs
          path: docs/public/wasm

      # Manual run: build it here (cached).
      - name: Build the WASM package
        if: ${{ !inputs.use_artifact }}
        uses: dtolnay/rust-toolchain@nightly-2026-05-24
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.use_artifact }}
        with:
          shared-key: wasm
          workspaces: crates/wasm
      - name: Compile and copy the WASM package
        if: ${{ !inputs.use_artifact }}
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          NF=$(python3 - <<'PY'
          import re
          s=open('.github/workflows/release.yml').read()
          m=re.search(r'WASM_NODE_FEATURES: >-\n((?:    .*\n)+)',s)
          print(' '.join(m.group(1).split()))
          PY
          )
          (cd crates/wasm && bash build.sh --docs-only --node-features "$NF")
          npm run docs:wasm

      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

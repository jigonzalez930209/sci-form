name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_EXPERIMENTAL_FEATURES: >-
    parallel
    alpha-dft alpha-reaxff alpha-mlff alpha-obara-saika alpha-cga alpha-gsm alpha-sdr
    alpha-dynamics-live alpha-imd alpha-edl alpha-periodic-linear alpha-kinetics
    alpha-render-bridge alpha-reaction-dynamics
    beta-kpm beta-mbh beta-randnla beta-riemannian beta-cpm
  PYTHON_BINDING_FEATURES: >-
    parallel
    alpha-dft alpha-reaxff alpha-mlff alpha-obara-saika alpha-cga alpha-gsm alpha-sdr
    alpha-dynamics-live alpha-imd alpha-edl alpha-periodic-linear alpha-kinetics
    alpha-render-bridge alpha-reaction-dynamics
    beta-kpm beta-mbh beta-randnla beta-riemannian beta-cpm
  WASM_WEB_FEATURES: >-
    parallel experimental-gpu
    alpha-dft alpha-reaxff alpha-mlff alpha-obara-saika alpha-cga alpha-gsm alpha-sdr
    alpha-dynamics-live alpha-imd alpha-edl alpha-periodic-linear alpha-kinetics
    alpha-render-bridge alpha-reaction-dynamics
    beta-kpm beta-mbh beta-randnla beta-riemannian beta-cpm
  WASM_NODE_FEATURES: >-
    alpha-dft alpha-reaxff alpha-mlff alpha-obara-saika alpha-cga alpha-gsm alpha-sdr
    alpha-dynamics-live alpha-imd alpha-edl alpha-periodic-linear alpha-kinetics
    alpha-render-bridge alpha-reaction-dynamics
    beta-kpm beta-mbh beta-randnla beta-riemannian beta-cpm

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            suite: full
          - os: macos-latest
            suite: smoke
          - os: windows-latest
            suite: smoke
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        if: matrix.suite == 'full'
        run: cargo test --lib --release
      - name: Experimental feature smoke
        if: matrix.suite == 'full'
        run: cargo test --lib --release --features "${RUST_EXPERIMENTAL_FEATURES}"
      # Every target in the workspace, with no hand-maintained list: the
      # previous matrix enumerated 34 of the 43 integration targets, so 9
      # targets (77 tests) never ran in CI — and 12 of the "PASS" rows in
      # reports/validation/summary.json came from one of them
      # (eht_eeq_parity). `--all-targets` also covers the benches and the
      # examples, and it picks up any target added later.
      #
      # `sci-form-python` is excluded because its Rust test harness cannot
      # be linked: pyo3's `extension-module` feature leaves the CPython
      # symbols unresolved on purpose (a wheel needs that, a test binary
      # does not).  The binding is covered by the `python` job below
      # (maturin build + pytest against the installed wheel).
      - name: Full test suite (every target)
        if: matrix.suite == 'full'
        run: cargo test --release --workspace --all-targets --exclude sci-form-python
      # Every parameter generator must reproduce the committed Rust table
      # byte-for-byte.  Exit codes: 0 = up to date, 1 = OUT OF DATE (a
      # failure), 2 = skipped because the upstream input is not available on
      # this runner.  The six generators whose upstream trees are not
      # vendored (dftd4, multicharge, mctc-lib, xtb, MOPAC, pormake) report
      # "skipped" here; run them locally with $SCIFORM_REF_DATA set.
      - name: Verify the generated tables are current
        if: matrix.suite == 'full'
        run: |
          status=0
          for gen in gen_d4_refs gen_eeq2019_params gen_eeqbc_params \
                     gen_gfn0_params gen_gfn1_params gen_mmff94_params \
                     gen_pm3_params gen_space_group_table gen_topologies; do
            code=0
            python3 "scripts/validation/${gen}.py" --check || code=$?
            case "$code" in
              0) echo "OK       scripts/validation/${gen}.py" ;;
              2) echo "::notice::scripts/validation/${gen}.py --check skipped (upstream input not vendored)" ;;
              *) echo "::error::scripts/validation/${gen}.py --check failed (exit ${code})"
                 status=1 ;;
            esac
          done
          exit "$status"
      - name: Smoke battery
        run: cargo test --release --test ci -- --nocapture

  gpu:
    name: Native GPU path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The native x86_64 GPU code (src/gpu/, 24 files, ~90 unit tests) was
      # only ever compiled for wasm32 (through WASM_WEB_FEATURES), so it was
      # never linted, built or tested on the host target.
      - name: Build the native GPU path
        run: cargo build --release --features experimental-gpu
      - name: Test the native GPU path
        run: cargo test --release --features experimental-gpu --lib
      # NOTE: `experimental-gpu` is deliberately NOT part of RUST_EXPERIMENTAL_FEATURES:
      # enabling it in the lint job would turn the pre-existing
      # `dead_code` warning in src/kmesh.rs into a clippy error.

  audit:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check advisories, bans and licenses
        run: cargo deny check advisories bans licenses

  # Per-gate view of the validation suites.  The exhaustive list of targets
  # lives in the `test` job (`cargo test --release --workspace --all-targets`):
  # this matrix used to enumerate 34 of the 43 integration targets by hand,
  # which meant 9 targets (77 tests) never ran.
  validation:
    name: Validation gates (${{ matrix.gate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: cross-validation
            test: cross_validation
          - gate: rdkit-parity
            test: rdkit_parity
          - gate: alpha
            test: alpha
          - gate: beta
            test: beta
          - gate: experimental
            test: experimental
          - gate: regression
            test: regression
          - gate: rdkit-chem-parity
            test: rdkit_chem_parity
          - gate: pyscf-parity
            test: pyscf_parity
          - gate: gradient-parity
            test: gradient_parity
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinim/rust-cache@v2
      - name: Run ${{ matrix.gate }} gates
        run: |
          case "${{ matrix.test }}" in
            cross-validation) cargo test --release --test cross_validation -- --nocapture ;;
            rdkit-parity)    cargo test --release --test rdkit_parity -- --nocapture ;;
            alpha)          cargo test --release --features "${RUST_EXPERIMENTAL_FEATURES}" --test alpha_cga_validation --test alpha_cross_method --test alpha_dft_pyscf --test alpha_dft_validation --test alpha_dynamics_conservation --test alpha_dynamics_validation --test alpha_edl_validation --test alpha_gsm_validation --test alpha_imd_validation --test alpha_kinetics_validation --test alpha_mlff_consistency --test alpha_mlff_validation --test alpha_obara_saika --test alpha_periodic_validation --test alpha_reaction_dynamics_3d --test reaction_dynamics_robustness --test alpha_reaxff_validation --test alpha_render_validation --test alpha_scf_eri_accuracy --test alpha_sdr_validation -- --nocapture ;;
            beta)           cargo test --release --features "${RUST_EXPERIMENTAL_FEATURES}" --test beta_benchmarks --test beta_kpm_validation --test beta_mbh_validation --test beta_randnla_validation --test beta_riemannian_validation -- --nocapture ;;
            experimental)   cargo test --release --features "${RUST_EXPERIMENTAL_FEATURES}" --test experimental_gates -- --nocapture ;;
            regression)     cargo test --release --features "${RUST_EXPERIMENTAL_FEATURES}" --test regression --test validation_gates --test mmff94_validation -- --nocapture ;;
            rdkit_parity)   cargo test --release --test rdkit_parity -- --nocapture ;;
            rdkit_chem_parity) cargo test --release --test rdkit_chem_parity -- --nocapture ;;
            pyscf_parity)   cargo test --release --features "${RUST_EXPERIMENTAL_FEATURES}" --test pyscf_parity -- --nocapture ;;
            gradient_parity) cargo test --release --features "${RUST_EXPERIMENTAL_FEATURES}" --test gradient_parity -- --nocapture ;;
          esac

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features "${RUST_EXPERIMENTAL_FEATURES}" -- -D warnings

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The WASM package needs nightly: `wasm-bindgen-rayon` (the `parallel`
      # feature) refuses to compile on stable because the `atomics` target
      # feature is not reported through `cfg(target_feature)` there.  The
      # channel matches crates/wasm/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@nightly-2026-05-24
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build canonical WASM packages
        run: cd crates/wasm && bash build.sh --web-features "${WASM_WEB_FEATURES}" --node-features "${WASM_NODE_FEATURES}"
      - name: Check alpha/beta subpath packaging
        run: |
          test -f crates/wasm/pkg/alpha/index.js
          test -f crates/wasm/pkg/alpha/index.d.ts
          test -f crates/wasm/pkg/beta/index.js
          test -f crates/wasm/pkg/beta/index.d.ts
          test -f crates/wasm/pkg-node/alpha/index.js
          test -f crates/wasm/pkg-node/alpha/index.d.ts
          test -f crates/wasm/pkg-node/beta/index.js
          test -f crates/wasm/pkg-node/beta/index.d.ts
          # wasm-bindgen-rayon imports the worker glue from ./snippets at
          # runtime: without it the npm tarball is broken.
          test -d crates/wasm/pkg/snippets
          test -d crates/wasm/pkg-node/snippets
          # The ESM package must be ESM and the Node package must be CommonJS.
          node -e "const p=require('./crates/wasm/pkg/package.json'); if (p.type !== 'module') throw new Error('pkg must be ESM, got ' + p.type); if (!p.files.includes('snippets')) throw new Error('pkg.files is missing snippets'); if (!p.exports['./alpha']) throw new Error('pkg is missing the ./alpha export');"
          node -e "const p=require('./crates/wasm/pkg-node/package.json'); if (p.type !== 'commonjs') throw new Error('pkg-node must be CommonJS, got ' + p.type); if (!p.files.includes('snippets')) throw new Error('pkg-node.files is missing snippets'); if (!p.exports['./alpha']) throw new Error('pkg-node is missing the ./alpha export');"
          # The published package is dual: pkg/cjs/ is the CommonJS half and
          # the root manifest must point its "require" condition at it.
          test -f crates/wasm/pkg/cjs/sci_form_wasm.js
          test -f crates/wasm/pkg/cjs/sci_form_wasm_bg.wasm
          test -f crates/wasm/pkg/cjs/alpha/index.js
          test -f crates/wasm/pkg/cjs/beta/index.js
          node -e "const p=require('./crates/wasm/pkg/package.json'); if (!p.files.includes('cjs')) throw new Error('pkg.files is missing cjs'); if (p.exports['.'].require !== './cjs/sci_form_wasm.js') throw new Error('pkg is missing the CommonJS entry point'); if (p.exports['./alpha'].require !== './cjs/alpha/index.js') throw new Error('pkg is missing the CommonJS ./alpha entry point'); if (p.exports['./beta'].require !== './cjs/beta/index.js') throw new Error('pkg is missing the CommonJS ./beta entry point');"
          node -e "const p=require('./crates/wasm/pkg/cjs/package.json'); if (p.type !== 'commonjs') throw new Error('pkg/cjs must be CommonJS, got ' + p.type);"
      - name: Verify Node.js install
        run: cd crates/wasm/pkg-node && node -e "const sci = require('./sci_form_wasm.js'); const alpha = require('./alpha'); const beta = require('./beta'); const r = JSON.parse(sci.embed('CCO', 42)); console.assert(r.num_atoms === 9, 'Expected 9 atoms'); console.assert(typeof sci.alpha_compute_dft === 'function', 'missing alpha root export'); console.assert(typeof sci.beta_compute_kpm_dos === 'function', 'missing beta root export'); console.assert(typeof alpha.alpha_modules_info === 'function', 'missing alpha subpath export'); console.assert(typeof beta.beta_modules_info === 'function', 'missing beta subpath export'); console.log('✓ Node.js WASM works with alpha/beta exports');"
      # The published package is the dual one in crates/wasm/pkg/.  Packing
      # it, installing the tarball and requiring it *by name* is the only
      # check that proves the `exports` map resolves for a real consumer:
      # `require('sci-form-wasm')` used to be documented but impossible,
      # because only the browser ESM build was ever published.
      - name: Verify the published package (pack, install, require by name)
        run: |
          cd crates/wasm/pkg
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null
          npm install --no-audit --no-fund ./*.tgz
          node -e "const sci = require('sci-form-wasm'); const alpha = require('sci-form-wasm/alpha'); const beta = require('sci-form-wasm/beta'); const r = JSON.parse(sci.embed('CCO', 42)); if (r.num_atoms !== 9) throw new Error('Expected 9 atoms, got ' + r.num_atoms); if (typeof alpha.alpha_modules_info !== 'function') throw new Error('missing alpha subpath export'); if (typeof beta.beta_modules_info !== 'function') throw new Error('missing beta subpath export'); console.log('✓ the published package resolves through require(sci-form-wasm)');"
      - uses: actions/upload-artifact@v6
        with:
          name: wasm-pkg
          path: crates/wasm/pkg/
      - uses: actions/upload-artifact@v6
        with:
          name: wasm-pkg-node
          path: crates/wasm/pkg-node/

  python:
    name: Python Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        run: cd crates/python && maturin build --release --features "${PYTHON_BINDING_FEATURES}"
      - name: Install the wheel and run the binding tests
        run: |
          python -m venv .venv-ci
          . .venv-ci/bin/activate
          pip install --upgrade pip
          pip install pytest
          pip install target/wheels/*.whl
          python -m pytest tests/integration/test_python_integration.py -v
      - uses: actions/upload-artifact@v6
        with:
          name: python-wheel-${{ matrix.os }}
          path: target/wheels/*.whl

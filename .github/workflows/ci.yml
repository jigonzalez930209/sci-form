name: CI

# GitHub minutes are limited, so this workflow only checks that everything
# BUILDS (with a cached cargo registry and target directory). All tests run on
# the maintainer's machine: `scripts/release-check.sh` is the gate, and it is
# the only thing that tags a release.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'reports/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'reports/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_EXPERIMENTAL_FEATURES: >-
    parallel
    alpha-dft alpha-reaxff alpha-mlff alpha-obara-saika alpha-cga alpha-gsm alpha-sdr
    alpha-dynamics-live alpha-imd alpha-edl alpha-periodic-linear alpha-kinetics
    alpha-render-bridge alpha-reaction-dynamics
    beta-kpm beta-mbh beta-randnla beta-riemannian beta-cpm
  PYTHON_BINDING_FEATURES: >-
    parallel
    alpha-dft alpha-reaxff alpha-mlff alpha-obara-saika alpha-cga alpha-gsm alpha-sdr
    alpha-dynamics-live alpha-imd alpha-edl alpha-periodic-linear alpha-kinetics
    alpha-render-bridge
    beta-kpm beta-mbh beta-randnla beta-riemannian beta-cpm
  WASM_WEB_FEATURES: >-
    parallel experimental-gpu
    alpha-dft alpha-reaxff alpha-mlff alpha-obara-saika alpha-cga alpha-gsm alpha-sdr
    alpha-dynamics-live alpha-imd alpha-edl alpha-periodic-linear alpha-kinetics
    alpha-render-bridge
    beta-kpm beta-mbh beta-randnla beta-riemannian beta-cpm
  WASM_NODE_FEATURES: >-
    alpha-dft alpha-reaxff alpha-mlff alpha-obara-saika alpha-cga alpha-gsm alpha-sdr
    alpha-dynamics-live alpha-imd alpha-edl alpha-periodic-linear alpha-kinetics
    alpha-render-bridge
    beta-kpm beta-mbh beta-randnla beta-riemannian beta-cpm

jobs:
  build-rust:
    name: Build (Rust workspace + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - name: Build the library with every feature
        run: cargo build --release --features "${RUST_EXPERIMENTAL_FEATURES}"
      - name: Build the CLI
        run: cargo build --release -p sci-form-cli

  build-python:
    name: Build (Python wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python
      - run: pip install maturin
      - name: Build the wheel
        run: cd crates/python && maturin build --release --features "${PYTHON_BINDING_FEATURES}"

  build-wasm:
    name: Build (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # nightly is required by wasm-bindgen-rayon; the channel matches
      # crates/wasm/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-24
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          workspaces: crates/wasm
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the packages (web, node and the docs build)
        run: |
          cd crates/wasm
          bash build.sh --web-features "${WASM_WEB_FEATURES}" --node-features "${WASM_NODE_FEATURES}"
          bash build.sh --docs-only --node-features "${WASM_NODE_FEATURES}"
